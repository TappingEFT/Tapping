<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro · Tapping</title>
<link rel="icon" href="app-icon.png">
<link rel="apple-touch-icon" href="app-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tapping">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --stone:#FFFFFF; --stone-deep:#EDE7DC; --ink:#141210; --ink-soft:#4A4438;
    --sienna:#B23D14; --sienna-deep:#8F2F0E; --sage:#3E5A2E; --sage-deep:#2F4522;
    --plum:#5A2E52; --card:#FAF6EE; --line:rgba(20,18,16,0.28);
  }
  body.theme-dark{
    color-scheme: dark;
    --stone:#1C1A17; --stone-deep:#141210; --ink:#F2EEE6; --ink-soft:#C9C2B4;
    --sienna:#E2703A; --sienna-deep:#F0895A; --sage:#7FA365; --sage-deep:#96B87E;
    --plum:#B784AC; --card:#26221D; --line:rgba(242,238,230,0.22);
  }
  body.theme-sepia{
    color-scheme: light;
    --stone:#F3E9D6; --stone-deep:#E8DABE; --ink:#2E2417; --ink-soft:#5C4E38;
    --sienna:#A8431A; --sienna-deep:#8A360F; --sage:#3E5A2E; --sage-deep:#2F4522;
    --plum:#5A2E52; --card:#FAF1DD; --line:rgba(46,36,23,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--stone);}
  html,body{margin:0;padding:0;}
  body{background:var(--stone);color:var(--ink);font-family:'Source Sans 3',Arial,sans-serif;font-size:18px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Source Sans 3',Arial,sans-serif;font-weight:700;margin:0;letter-spacing:0;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--stone);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 6px;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;font-family:'Source Sans 3',sans-serif;padding:6px 0;cursor:pointer;}
  .back-btn:active{opacity:0.6;}

  .home-header{padding:8px 24px 4px;position:relative;}
  .settings-btn{position:absolute;top:8px;right:24px;background:none;border:none;font-size:24px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:6px;}
  .settings-btn:active{opacity:0.6;}
  .home-header .eyebrow{color:var(--sienna-deep);font-size:16px;margin-bottom:6px;font-weight:600;}
  .home-header h1{font-size:36px;}
  .home-header p{color:var(--ink-soft);font-size:18px;line-height:1.55;margin-top:10px;max-width:34ch;}

  .grid{padding:16px 20px 8px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cat-card{position:relative;border-radius:10px;overflow:hidden;height:150px;cursor:pointer;display:flex;align-items:flex-end;border:1px solid var(--line);}
  .cat-card:active{transform:scale(0.98);}
  .cat-card .cat-overlay{position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.05) 100%);}
  .cat-card .cat-text{position:relative;padding:12px 12px;color:#fff;width:100%;}
  .cat-card .cat-text h3{font-size:16px;color:#fff;margin-bottom:2px;line-height:1.15;}
  .cat-card .cat-text span{font-size:12.5px;color:rgba(255,255,255,0.88);}

  .hero-wrap{position:relative;width:100%;height:260px;overflow:hidden;}
  .hero-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-wrap .hero-fallback{width:100%;height:100%;}
  .hero-back{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.9);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:#141210;cursor:pointer;}
  .detail-body{padding:22px 24px 30px;}
  .detail-body h1{font-size:26px;margin-bottom:0;}
  .detail-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .fav-icon-btn{background:none;border:none;font-size:24px;line-height:1;color:var(--line);cursor:pointer;padding:4px;flex-shrink:0;}
  .fav-icon-btn.active{color:var(--sienna-deep);}
  .points-guide-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .points-guide-item{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--card);}
  .points-guide-item img{width:100%;height:130px;object-fit:cover;display:block;}
  .points-guide-label{padding:10px 12px 12px;}
  .points-guide-label strong{display:block;font-size:14.5px;color:var(--ink);}
  .points-guide-label span{display:block;font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .points-guide-item img{cursor:zoom-in;}
  .point-lightbox{position:fixed;inset:0;background:rgba(10,9,8,0.92);display:none;align-items:center;justify-content:center;z-index:500;padding:24px;cursor:zoom-out;}
  .point-lightbox.open{display:flex;}
  .point-lightbox img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain;}
  .detail-meta{font-size:14.5px;color:var(--ink-soft);margin-bottom:18px;}
  .detail-desc{font-size:16px;line-height:1.6;color:var(--ink);margin-bottom:26px;}
  .action-row{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px;}
  .action-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;cursor:pointer;border-right:1px solid var(--line);background:none;border-top:none;border-bottom:none;font-family:'Source Sans 3',Arial,sans-serif;}
  .action-item:last-child{border-right:none;}
  .action-item .icon{font-size:19px;}
  .action-item .label{font-size:12px;color:var(--ink-soft);letter-spacing:0.02em;text-transform:uppercase;}
  .action-item.active .icon, .action-item.active .label{color:var(--sienna);}
  .action-toast{text-align:center;font-size:14px;font-weight:600;color:#fff;background:var(--sienna);border-radius:6px;padding:10px;margin:-6px 0 20px;min-height:16px;}
  .action-toast:empty{background:none;padding:0;margin:-14px 0 20px;}

  .intro-card{margin:0 20px 4px;padding:18px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;gap:14px;cursor:pointer;}
  .guide-cta{width:calc(100% - 40px);margin:4px 20px 14px;padding:14px 16px;border:none;border-radius:10px;background:var(--sienna-deep);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;font-family:'Source Sans 3',Arial,sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;text-align:left;}
  .intro-card:active{background:var(--stone-deep);}
  .intro-card .dot{width:40px;height:40px;border-radius:50%;background:var(--sienna);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .intro-card h3{font-size:17px;margin-bottom:2px;}
  .intro-card span{font-size:14px;color:var(--ink-soft);}

  .quick-block{margin:14px 20px 4px;}
  .quick-title{font-size:15px;font-weight:700;margin-bottom:10px;}
  .quick-row{display:flex;flex-wrap:wrap;gap:8px;}
  .quick-pill{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;font-size:14px;color:var(--ink);cursor:pointer;font-family:'Source Sans 3',Arial,sans-serif;}
  .quick-pill:active{background:var(--stone-deep);}

  .thermo-block{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .thermo-value{font-size:44px;font-weight:700;}
  .thermo-row{display:flex;align-items:stretch;gap:16px;height:260px;}
  .thermo-labels{display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--ink-soft);font-weight:600;padding:2px 0;}
  .thermo-track{position:relative;width:14px;background:var(--stone-deep);border:2px solid var(--line);border-radius:8px;touch-action:none;}
  .thermo-fill{position:absolute;bottom:0;left:0;right:0;background:var(--sienna);border-radius:0 0 6px 6px;height:0%;}
  .thermo-thumb{position:absolute;left:50%;bottom:0%;width:30px;height:30px;background:#fff;border:3px solid var(--sienna);border-radius:50%;transform:translate(-50%,50%);}

  .diagram-wrap{position:relative;width:190px;margin:0 auto 8px;border-radius:10px;overflow:hidden;}
  .diagram-wrap img{width:100%;display:block;}

  .thermo-h-block{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:260px;margin:14px auto 0;}
  .thermo-h-native{width:100%;accent-color:var(--sienna);height:6px;}
  .thermo-h-labels{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .pt-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.85);transform:translate(-50%,-50%);}
  .pt-dot.active{width:16px;height:16px;background:var(--sienna);border:2px solid #fff;animation:ptpulse 1.3s ease-out infinite;}
  @keyframes ptpulse{
    0%{box-shadow:0 0 0 0 rgba(178,61,20,0.55);}
    70%{box-shadow:0 0 0 16px rgba(178,61,20,0);}
    100%{box-shadow:0 0 0 0 rgba(178,61,20,0);}
  }

  .settings-row{margin:6px 20px 4px;padding:16px;border:2px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--ink);}
  .seg{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:8px 14px;font-size:16px;color:var(--ink);cursor:pointer;}
  .seg button.active{background:var(--sienna);color:#fff;}

  .hist-link{margin:6px 20px 0;padding:16px 18px;border:2px dashed var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--ink);font-size:16.5px;}
  .hist-link:active{opacity:0.6;}
  .footer-note{padding:16px 26px 34px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}

  .session-wrap{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .cat-tag{font-size:15px;color:var(--sienna-deep);margin-bottom:6px;font-weight:600;}
  .session-wrap h2{font-size:27px;margin-bottom:14px;}
  .stage-copy{color:var(--ink);font-size:17.5px;line-height:1.6;margin-bottom:22px;}

  .sud-row{display:flex;align-items:center;gap:14px;margin:8px 0 26px;}
  .sud-row input[type=range]{flex:1;accent-color:var(--sienna);height:8px;}
  .sud-value{font-size:34px;font-weight:700;min-width:40px;text-align:center;}

  .phrase-box{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px;}
  .phrase-box p{font-size:20px;font-weight:500;line-height:1.55;margin:0;}

  /* --- Player screen (hands-free) --- */
  .player{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .player-top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 4px;}
  .player-top .exit{background:none;border:none;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;}
  .player-top .phase-label{font-size:15px;color:var(--sienna-deep);font-weight:600;}

  .progress-track{height:6px;background:var(--stone-deep);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 30px;}
  .progress-fill{height:100%;background:var(--sienna);width:0%;transition:none;}

  .player-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
  .round-title{font-size:22px;font-weight:700;color:var(--ink);}
  .rep-count{font-size:15px;color:var(--ink);letter-spacing:0.03em;font-weight:600;}
  .point-name{font-size:34px;font-weight:700;margin-top:6px;color:var(--ink);}
  .point-where{font-size:17px;color:var(--ink-soft);margin-top:4px;}
  .point-phrase{font-size:18px;color:var(--sienna-deep);font-weight:600;line-height:1.5;margin-top:22px;width:100%;text-align:left;align-self:stretch;}

  .timer-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;}
  .timer-ring span{font-size:17px;font-weight:700;}

  .player-controls{display:flex;justify-content:center;gap:18px;padding-top:22px;}
  .ctrl-btn{background:var(--card);border:2px solid var(--line);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);cursor:pointer;}
  .ctrl-btn:active{background:var(--stone-deep);}

  .btn{border:none;border-radius:6px;padding:18px 20px;font-size:18px;font-family:'Source Sans 3',sans-serif;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--sienna);color:#fff;}
  .btn-primary:active{background:var(--sienna-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px;}
  .btn-ghost:active{background:var(--stone-deep);}
  .spacer{flex:1;}

  .choice-row{display:flex;gap:10px;margin-top:6px;}
  .choice-row .btn{flex:1;}

  .end-summary{display:flex;justify-content:space-around;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:26px 12px;margin-bottom:20px;}
  .end-summary .num{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .end-summary .num strong{font-size:40px;font-weight:700;}
  .end-summary .num span{font-size:14px;color:var(--ink);}
  .end-summary .arrow{color:var(--ink);font-size:22px;}

  .hist-item{border-bottom:1px solid var(--line);padding:16px 2px;display:flex;justify-content:space-between;align-items:center;}
  .hist-item .l{display:flex;flex-direction:column;gap:2px;}
  .hist-item .l strong{font-size:17px;}
  .hist-item .l span{font-size:14px;color:var(--ink-soft);}
  .hist-item .r{font-size:17px;font-weight:700;color:var(--sienna-deep);}
  .empty-hist{color:var(--ink-soft);font-size:16px;padding:30px 4px;text-align:center;}
</style>
</head>

<div id="app"></div>

<script>
/* =================== Data =================== */
// Order matches the 8 tapping points used in every round (after the karate point).
const POINT_META = [
  {key:'ceja', name:'Ceja', where:'inicio de la ceja, junto al puente de la nariz', x:53, y:28},
  {key:'ladoOjo', name:'Lado del ojo', where:'hueso de la sien, junto al rabillo del ojo', x:59, y:31},

const KARATE_META = {key:'karate', name:'Canto de la mano', where:'lado exterior de la mano, bajo el meñique', x:37.8, y:76.1};
const DIAGRAM_IMG = 'mujer-tapping.jpg';

const POINT_GUIDE = [
  {name:'Canto de la mano', where:'lado exterior de la mano, bajo el meñique', photo:'punto_karate.jpg'},
  {name:'Ceja', where:'inicio de la ceja, junto al puente de la nariz', photo:'punto_ceja.jpg'},
  {name:'Lado del ojo', where:'hueso de la sien, junto al rabillo del ojo', photo:'punto_lado_ojo.jpg'},

function R(title, phrases, transition){ return {title, phrases, transition}; } // phrases: array of 8, matching POINT_META order; transition: optional line spoken before the round starts, with no point attached

const PRIMERA_SESION = {
  id:'primera-sesion', name:'Tu primera sesión', color:'#8F2F0E', photo:'primera_sesion.jpg',
  desc:'Una práctica corta para empezar, sin experiencia previa.',
  noRating:true,
  introScript:'Cerramos los ojos, tomamos aire por la nariz y lo exhalamos con suavidad. Vamos a realizar así un par de respiraciones para aquietar la mente y anclarnos por completo en el aquí y en el ahora. Muy bien, así se hace. Tú limítate a seguir mis pasos y a escuchar mis palabras; no es necesario que las repitas en voz alta, ya que el tapping se encarga de hacer el resto del trabajo de liberación y transformación.',
  karate:'Venga, comenzamos. En el punto kárate y repitiendo tres veces esta frase: aunque este método tal vez sea completamente nuevo para mí, decido abrirme a nuevas alternativas. A pesar de que quizá me resulte un poco extraño, elijo darme una oportunidad. Y aunque este procedimiento pueda parecerme un tanto peculiar y no sepa muy bien qué esperar, por ahora elijo no hacerme expectativas y simplemente permitirme aprovechar esta oportunidad.',
  outroScript:'Muy bien, pues ahora vamos a realizar un par de respiraciones más; si te apetece, puedes cerrar los ojos y, en lugar de pensar tanto, limitarte a sentir y a conectar profundamente con esta agradable sensación.',
  rounds:[
    R('Reconocer la experiencia',
      ['Empezamos en el inicio de la ceja: esta sensación que estoy experimentando ahora mismo.','Al lado del ojo: esto que estoy sintiendo.','Debajo del ojo: la verdad es que no sé muy bien qué pensar de todo esto.','Bajo la nariz: tengo dudas sobre si esto me aportará algún beneficio real.','En la barbilla: esto mismo que estoy percibiendo en mi interior.','En la clavícula: estos pensamientos que pasan por mi mente.','Debajo del brazo: es una sensación bastante curiosa, aunque por algún motivo me hace sentir bien.','Y en la coronilla: todo esto que estoy experimentando en este momento.'],
      'Perfecto, avanzamos con la primera ronda, recorriendo todos los puntos uno por uno.'),
    R('Liberar las dudas',
      ['Comenzamos en el inicio de la ceja: decido dejar ir todas estas dudas.','Al lado del ojo: elijo liberarme de esta inquietud que me acompañaba.','Debajo del ojo: opto por soltar cualquier exceso de pensamientos.','Bajo la nariz: decido despojarme de las ganas de analizarlo todo en exceso.','En la barbilla: elijo soltar todo aquello que me impedía conectar con la paz.','En la clavícula: decido liberar cualquier inseguridad interna para abrirme de par en par a esta vivencia.','Debajo del brazo: elijo dejar atrás cualquier temor o preocupación sobre si esto funcionará o no.','Y en la coronilla: simplemente decido abrirme por completo a esta experiencia.'],

      'Magnífico. Ahora avanzamos hacia la tercera ronda, el momento de sembrar una energía positiva y constructiva.'),
  ],
  apertura:[], cierre:[],
  audio:{file:'p_20362219_820.mp3', hasIntro:true, hasOutro:true, timestamps:[0,25.009,52.2886,58.9505,65.4731,69.6972,75.2631,80.9816,86.0461,91.1531,98.3956,103.825,112.915,118.707,124.176,129.671,135.582,141.505,148.585,155.516,161.413,170.034,176.187,181.105,186.644,192.126,197.669,202.561,209.491,215.84]},
};

const CATEGORIES = [
  {
    id:'resistencias', name:'Liberar resistencias', color:'#354A24', photo:'desbordada.jpg',
    audio:{file:'LIBERAR_RESISTENCIAS.mp3', hasIntro:true, hasOutro:true, timestamps:[0,31.0141,62.8974,68.1661,73.6587,78.6494,82.8272,87.533,92.9078,98.4016,104.482,109.287,117.534,122.711,126.601,131.833,137.021,141.771,148.009,154.485,159.953,178.318,182.038,186.752,190.955,194.322,197.683,200.984,206.069,210.333,213.774,216.627,220.011,224.382,227.927,231.222,235.566,239.195]},
    intro:'A veces hay una parte nuestra que se resiste, casi sin darnos cuenta, a recibir lo bueno que queremos. Esta sesión es un espacio para soltar esa resistencia interna y abrirte a la abundancia con más calma.',
    desc:'Para soltar bloqueos internos y abrirte a la abundancia.',
    introScript:'Vamos a empezar cerrando los ojos y vamos a hacer unas respiraciones profundas, tranquilas. Este es un momento para ti, solo para ti. Vamos a relajar la mente consciente, el exceso de pensamientos. Vamos a relajar también esa parte crítica, analítica, que juzga, que compara. Vamos simplemente a relajarnos y a disfrutar de esta experiencia para liberar cualquier posible resistencia que te esté impidiendo manifestar la abundancia que deseas. Comenzamos.',
    karate:'Empezamos haciendo tapping en el punto karate. Aunque puede ser que tengas alguna resistencia interna, tú eliges aceptarte y amarte completa y profundamente. Aunque puede ser que tengas alguna resistencia interna de la que quizá ni siquiera eres consciente, tú eliges liberar cualquier bloqueo y eliges abrirte a la abundancia. Aunque puede ser que tengas algún miedo, alguna preocupación, alguna necesidad de controlar que te está impidiendo tener ese estado de relajación y de apertura necesarios para atraer la abundancia, tú eliges liberarte.',
    outroScript:'Y tu único trabajo aquí es hacerte estos ejercicios y permitir esta elevación de tu vibración para sentirte mejor y para atraer más y más abundancia cada día. Muy bien, ahora dejamos de hacer tapping. No importa en qué punto te hayas quedado, igual has hecho tres rondas, cuatro, lo que sea, no importa. Si quieres puedes terminar en el punto de la cabeza, como tú prefieras. Entonces, dejamos de hacerlo. Si estabas con los ojos abiertos, ahora sería el momento de cerrarlos y vamos a respirar. Y vamos simplemente a observar, a permitir esta liberación que va a seguir su curso durante las próximas horas, durante los próximos días. Cuanto más lo hacemos, más nos vamos limpiando por dentro y más nos vamos conectando con el campo de la abundancia.',
    rounds:[
      R('Reconocer las resistencias',
        ['Empezamos en la base de la ceja, estas posibles resistencias.','Al lado del ojo, estas posibles resistencias internas.','Debajo del ojo, esta parte de ti que duda.','Debajo de la nariz, esta parte de ti que quizá se queja.','Barbilla, esta parte de ti que critica o juzga a otras personas.','Clavícula, esta parte de ti que tiene esos pensamientos negativos.','Debajo del brazo, esta parte de ti que te hace estar a veces con una vibración baja.','Punto de la cabeza, estas posibles resistencias.'],
        'Muy bien, ahora empezamos a hacer el tapping en todos los puntos.'),
      R('Liberar',
        ['En la base de la ceja, eliges soltar todo esto de tu interior.','Al lado del ojo, eliges liberarlo.','Debajo del ojo, quizá esto te venga de experiencias pasadas.','Debajo de la nariz, quizá incluso te venga de otras personas.','Barbilla, o quizá de tu propia interpretación de la realidad.','Clavícula, pero en cualquier caso, eliges liberar cualquier resistencia interna.','Debajo del brazo, eliges ser libre para poder conectarte con la abundancia que te rodea.','Punto de la cabeza, eliges simplemente disfrutar de este proceso.'],
        'Muy bien, ahora pasamos a la segunda ronda. Aquí vamos a empezar a liberar, a soltar todo esto.'),
      R('Soltar bloqueos profundos',
        ['Eliges soltar bloqueos profundos.','Eliges dejar de analizar, de juzgar, de comparar.','Todo eso son simplemente procesos mentales.','Todo eso viene de la distracción.','Quizá queremos sentirnos mejor.','Quizá queremos aliviar un miedo.','Es mucho más fácil darnos permiso para soltar ese miedo interno.','Nos damos permiso para soltar ese miedo interno.'],
        'Pasamos a la tercera ronda. Ahora ya no decimos el nombre de los puntos, sino que cambiamos más o menos una frase en cada punto, pero puedes ir a tu propio ritmo. Simplemente disfrútalo, no hay reglas. Venga, empezamos en la base de la ceja.'),
    ],
    apertura:[],
    cierre:['Vamos notando esta liberación.','El cuerpo se relaja.','Ya no tienes tanta preocupación.','Ya no te fijas tanto en lo que hacen otras personas.','Estás en un estado más positivo.','Puedes disfrutar más de la vida.','Empiezas a ver posibilidades que antes no veías.','Las cosas empiezan a fluir mejor.'],
  },
  {
    id:'escasez', name:'Salir de la escasez', color:'#8F2F0E', photo:'confianza_en_mi.jpg',
    audio:{file:'Escases.mp3', hasIntro:true, hasOutro:true, timestamps:[0,12.9882,41.0575,45.9182,52.6107,57.747,63.3633,69.8689,77.2358,84.0029,88.9543,93.4923,102.238,106.68,110.718,116.765,120.385,124.388,130.735,143.063,152.396,171.005,179.159,186.341,193.369,200.185,208.679,214.755,221.46]},
    intro:'Cuando la sensación de que algo falta se vuelve constante, cuesta disfrutar lo que ya tienes. Esta sesión es un espacio para soltar esa creencia y conectar con la sensación de plenitud.',
    desc:'Para soltar la creencia de que siempre falta algo.',
    introScript:'Cierra los ojos y regálate este instante de pausa para construir tu propio espacio de transformación. Respira con calma, sin prisa, saboreando el presente. Comenzamos.',
    karate:'Mientras comienzas a dar golpecitos suaves en el punto kárate. A pesar de que una parte de ti dude y sienta que no es suficiente, hoy decides abrazarte y aceptarte de forma absoluta. Aunque experimentes esa sensación de escasez que te empuja a acumular, hacer y lograr más para valorarte, eliges reconocerte y amarte tal como eres hoy. Y si descubres que tu atención se inclina más hacia lo que te falta que hacia lo que ya posees, eliges emprender tu camino de sanación.',
    outroScript:'Muy bien. Ahora podemos ir dejando de hacer tapping. Puedes finalizar en el punto de la cabeza o en el que prefieras, ya que no existen reglas fijas. Y para terminar, vamos a realizar unas cuantas respiraciones. Ahora aprovecha para experimentar aquello que deseas vivir. Imagina que tu sueño ya se ha cumplido y conéctate de verdad con esa emoción, sin necesidad de esperar a que se manifieste en el exterior. Es exactamente al revés: primero generas el sentimiento y después se materializa. Dedícate a cultivar esta frecuencia de abundancia, riqueza, humildad y amor, sabiendo que todo está bien tal y como es. Y simplemente da las gracias por ello. Gracias, gracias, gracias.',
    rounds:[
      R('Reconocer la escasez',
        ['Empezamos en la base de la ceja. Esta creencia de que no tienes suficiente.','Al lado del ojo, esta creencia de que quizá no eres suficiente.','Debajo del ojo, esta creencia como de que siempre parece que falta algo.','Debajo de la nariz, esta creencia que también te dice que es difícil que tengas más cosas.','Barbilla, y que además te dice que necesitas esas otras cosas para sentir esta plenitud, para estar bien.','Clavícula, esta parte de ti que te hace sentir como que falta algo, que siempre falta algo.','Debajo del brazo, esta sensación de que no estás llegando.','Punto de la cabeza, esta sensación de escasez.'],
        'Muy bien, ahora vamos a hacer tapping en todos los puntos.'),
      R('Soltar la carencia',
        ['Entonces, tú eliges soltar estos miedos.','Eliges soltar esta sensación de carencia.','Eliges liberar todo esto de tu interior, porque en realidad no necesitamos nada.','Ya somos seres completos y divinos.','Ya disfrutamos de muchísimos privilegios.','Y cuanto más completa se siente la persona, más se da cuenta de lo poco que necesitamos.','Lo curioso es que, al sentir esa plenitud y abundancia, la certeza de que ya lo tienes todo y no te falta nada, experimentas una profunda calma y seguridad, y es justo ahí cuando todo comienza a llegar.','Cuanto menos persigues las cosas, más se acercan a ti, más eres capaz de percibirlas y más oportunidades y posibilidades se abren a tu alrededor.'],
        'Segunda ronda. Aquí vamos a cambiar más o menos una frase en cada punto, recuerda que puedes ir a tu propio ritmo.'),
      R('Vivir desde la plenitud',
        ['Y entonces comprendes que en realidad todo era mucho más sencillo de lo que creías; que no se trata de correr detrás de las cosas, de obsesionarte con lo que te falta, de esforzarte por conseguirlo todo, de competir o de superar a los demás, ni de intentar hacerlo todo perfecto todo el tiempo, sino justo de lo contrario.','Por supuesto, sigue estando esa vocación de servicio, de acción y de cuidar y pensar en los demás, pero desde otro lugar.','Actuamos impulsados por lo que sentimos en el corazón, desde el amor y experimentando esa abundancia.','Lo verdaderamente importante no es tanto la acción en sí, sino el lugar interno desde el que la realizas.','Así, puedes decidir hacer las cosas desde la plenitud en lugar de partir de la carencia o la escasez.','Eliges sentir y pensar desde la tranquilidad y la certeza de que ya posees lo necesario en este instante y de que disfrutas lo que te corresponde.','Cuanto más te abres a este proceso, más atraes todo lo que precisas y mucho más.','Así que vamos a ejercitar el situarnos en este estado de abundancia donde sentimos que nada nos falta.']),
    ],
    apertura:[],
    cierre:[],
  },
  {
    id:'recibir', name:'Abrirte a recibir', color:'#4A2442', photo:'recibir.jpg',
    audio:{file:'ABRIRTE_A_RECIBIR.mp3', hasIntro:true, hasOutro:true, timestamps:[0,27.9992,46.7342,52.4894,57.313,62.9782,67.9655,73.7818,79.2248,85.6044,93.6363,102.384,108.243,113.307,122.622,128.353,135.885,146.659,154.557,160.896,171.65,177.718,194.501,209.093,221.197]},
    intro:'A veces pedimos abundancia con la mente, pero una parte de nosotras se incomoda en cuanto empieza a llegar. Esta sesión trabaja justo esa resistencia a recibir.',
    desc:'Para la parte de ti que se incomoda al recibir lo bueno.',
    introScript:'Cierra los ojos y lleva toda la atención a tu respiración, observando el cuerpo y sintiendo cómo entra y sale el aire con total naturalidad. Permítete contemplar las sensaciones tal cual son, sin juzgar, sin intentar intervenir ni controlar nada. Estas prácticas nos permiten desprendernos del ego, experimentar la verdadera libertad y dar forma a nuestra mejor realidad. Así que respira con calma y ábrete a este espacio sagrado de liberación y manifestación.',
    karate:'Comenzamos en el punto kárate. Aunque existe en ti un deseo profundo de atraer abundancia, es probable que otra parte de tu ser experimente incomodidad al recibir. A pesar de que conscientemente buscas esa prosperidad, quizás por algún motivo haya un mecanismo interno que se resiste y la rechaza.',
    outroScript:'Permítete recrearte en estas sensaciones y emociones, relajando el cuerpo para que tanto tu organismo como tu mente se habitúen a esta nueva realidad de abundancia. Por tanto, ahora detenemos los golpecitos de tapping y realizamos una respiración profunda. Nos quedamos unos instantes disfrutando de este espacio de relajación, paz y serenidad. Nota lo bien que te sienta experimentar que has recibido, sintiendo que es algo totalmente seguro, positivo y que te hace sentir una excelente persona. Te sientes de maravilla y, al instalarte en esa frecuencia de seguridad y tranquilidad, es cuando comienzas a atraer todavía más cosas buenas. Gracias, gracias, gracias.',
    rounds:[
      R('Reconocer la resistencia a recibir',
        ['Empezamos en el inicio de la ceja con esa parte de ti que rechaza la abundancia.','Al lado del ojo, con aquello que tal vez la esté frenando.','Debajo del ojo, con las creencias que hacen que apartes lo bueno que te llega.','Bajo la nariz, con todos esos pensamientos limitantes.','En la barbilla, con la idea de que al ser algo nuevo, prefieres rechazarlo.','En la clavícula, con esa resistencia a salir de tu zona de confort.','Debajo del brazo, con la sensación de que te sientes más segura quedándote donde estás.','Y en la coronilla, con la posibilidad de que recibir abundancia te resulte tan desconocido que hasta lo percibas como un peligro.']),
      R('Liberar la resistencia',
        [
          {key:'ceja', phrase:'Comenzamos en el inicio de la ceja decidiendo liberar todas estas limitaciones.'},
          {key:'ladoOjo', phrase:'Al lado del ojo, soltando estos pensamientos repetitivos.'},
          {key:'debajoOjo', phrase:'Debajo del ojo, desprendiéndote de cualquier miedo interno que te susurre que recibir es peligroso, de mala educación, incorrecto o inadecuado.'},
          {key:'barbilla', phrase:'En la barbilla, dándote el permiso de cuestionar cada una de esas ideas.'},
          {key:null, phrase:'Y al avanzar por el resto de los puntos, simplemente obsérvalas con atención para liberarte por completo de ellas.'},
        ],
        'Segunda ronda. Aquí vamos a cambiar más o menos una frase en cada punto, recuerda que puedes ir a tu propio ritmo.'),
      R('Abrirte a lo nuevo',
        ['Tal vez recibir abundancia no sea tan negativo como creías; de hecho, al tener más, posees mayores recursos para ayudar a los demás, ser más generoso y sentirte mejor.','Quizás contar con esa prosperidad te permita hacer felices a otras personas y facilitar tanto tu vida como la de tu entorno.','Date la oportunidad de abrirte a nuevas perspectivas que resulten igual o incluso más seguras.','Imagina por un instante que ya estás ahí, en ese escenario donde disfrutas de plena abundancia, de infinitas posibilidades y de tener más que suficiente para todo lo que deseas.','Conéctate con esa profunda sensación de tranquilidad, de paz y de total apertura.','Y si te llegan cosas buenas, ya sean grandes o pequeñas, las recibes con agrado, te sientes a gusto con ellas, das las gracias si te apetece y experimentas la certeza de que te lo mereces, disfrutando de una profunda sensación de abundancia y comodidad porque es algo positivo.','La abundancia es completamente natural, forma parte de nuestra verdadera esencia y es beneficiosa para todos; nos permite dar, recibir y compartir, y cuando se utiliza con buen criterio, resulta saludable y enriquecedora para cualquier persona.','Por eso decides abrirte por completo a todo lo positivo que llegue a tu vida, disfrutando plenamente de ello y sabiendo que cuentas con la capacidad de gestionarlo, administrarlo, gozarlo y compartirlo.']),
    ],
    apertura:[],
    cierre:[],

  {
    id:'merecimiento', name:'Abrirte al merecimiento', color:'#4A2442', photo:'preocupacion.jpg',
    intro:'A veces nos ponemos condiciones invisibles para permitirnos disfrutar o recibir: "primero tengo que lograr esto", "primero merecerlo". Esta sesión suelta esas condiciones internas.',
    desc:'Para soltar las condiciones que te pones antes de permitirte recibir.',
    introScript:'Comenzamos cerrando los ojos y conectando con la respiración. Con cada exhalación, imagina que liberas cualquier obstáculo interno; puedes visualizar esa energía densa ubicada en lo más profundo de tu cuerpo, entre tus órganos y entrañas, que tal vez te haya mantenido bloqueada. Así que imagínate que al exhalar dejas marchar por completo esa energía estancada y te vas liberando.',
    karate:'Comenzamos en el punto kárate. Aunque tal vez una parte de ti crea que requiere de ciertas condiciones para atraer la abundancia, tú decides dejar ir todas estas limitaciones. A pesar de que quizá experimentes la sensación de que necesitas lograr, hacer o ser algo más antes de poder atraer prosperidad, eliges soltar esas exigencias internas. Aunque es posible que te hayas impuesto esas reglas previas para recibir, hoy decides liberarte de todo ello y abrirte por completo al merecimiento.',
    outroScript:'Perfecto, ahora detenemos los golpecitos de tapping y realizamos unas respiraciones profundas. Pon la firme intención de que, con cada exhalación, te vas liberando y limpiando de cualquier posible autoexigencia, de toda culpa y de cualquier condicionamiento mental. Y ten por seguro que, cuanto más practiques esto y más te liberes, con mayor facilidad acudirá la abundancia a tu vida de la manera más favorable. Gracias, gracias, gracias.',
    rounds:[
      R('Reconocer las condiciones impuestas',
        ['Perfecto, ahora recorremos todos los puntos. Comenzando en el inicio de la ceja con esa faceta tuya que impone condiciones.','Al lado del ojo, con esa parte que va postergando la abundancia.','Debajo del ojo, con ese pensamiento de que antes de lograrlo debes cumplir con muchas tareas previas.','Bajo la nariz, con esa actitud que a veces ni te permite disfrutar de lo que ya posees.','En la barbilla, con esa voz que te frena el goce porque te exige hacer más.','En la clavícula, con tu tendencia a la autoexigencia extrema.','Debajo del brazo, con aquello que te impide disfrutar de la vida, de todo lo que tienes y de lo que eres.','Y en la coronilla, con todo esto que te ha venido bloqueando.']),
      R('Abrirte sin condiciones',
        ['Bien, pues esto que te ha estado frenando hasta este momento está a punto de disolverse.','Decides dejar ir cualquier obstáculo interno, porque no te hacen falta condiciones ni requisitos previos.','Puedes abrirte al merecimiento ahora mismo, eligiendo hacerlo de la forma que resulte más óptima para ti, de un modo mucho más fluido y directo, sin dar tantas vueltas, sin tener que investigar tanto ni pasar por tantos intentos fallidos.','Decides conectar con la vía más directa, la más fluida y la más adecuada para ti, abriéndote a ella sin restricciones, sin temores, sin reservas, sin culpas y sin la falsa idea de que antes debes cumplir con mil tareas.','Te abres a recibir lo que sea mejor para ti y puedes repetirte: me considero una persona que lo merece.','He dado muchísimo en la vida, muchísimo, y ahora me abro a recibir también en gran medida.','Me abro al merecimiento, me abro a la abundancia, me abro a lo mejor para mí.','Venga, que venga todo.'],
        'Segunda ronda. Aquí vamos a cambiar más o menos una frase en cada punto, recuerda que puedes ir a tu propio ritmo.'),
      R('Tu condición natural',
        ['Imagina que abres los brazos y abres una puerta de par en par para que llegue a ti todo lo mejor, porque esa es tu condición natural.','Tal como comentábamos en el audio anterior, lo más natural es la abundancia, es contar con todo lo que precisas, es vivir y disfrutar.','Por eso, eliges sentirte una persona cada vez más y más merecedora de lo mejor.']),
    ],

    audio:{file:'Merecimiento.mp3', hasIntro:true, hasOutro:true, timestamps:[0,23.2232,52.4173,57.0757,62.8557,68.0892,75.1462,81.3896,87.1498,92.3049,99.4566,104.292,113.04,119.233,126.432,140.522,153.865,160.904,167.45,173.166,176.357,184.513,190.596]},

  {
    id:'abundancia', name:'Abundancia', color:'#8F2F0E', photo:'abundancia.jpg',
    intro:'El dinero puede convertirse en una fuente constante de miedo sin que nos demos cuenta. Esta sesión te acompaña a soltar esa tensión, punto a punto, hasta que la idea de la abundancia deje de sentirse como una batalla.',
    desc:'Miedo y creencias alrededor del dinero.',
    karate:'Aunque siento este miedo a no tener suficiente, aunque a veces me cuesta sentirme segura con el dinero, me acepto completamente y acepto todo lo que estoy sintiendo ahora mismo.',
    rounds:[
      R('Reconocer', ['Siento este miedo a no tener suficiente.','Siento esta inseguridad con el dinero.','A veces siento que tengo que luchar por todo.','Reconozco esta preocupación económica.','Reconozco que esto me pesa.','Todo este miedo al futuro económico.','Toda esta inseguridad que cargo.','Reconozco cómo me siento con el dinero, ahora mismo.']),
      R('Profundizar', ['Este miedo a que no me alcance.','Este miedo a perder lo que tengo.','Esta sensación de no tener el control.','Esta creencia de que el dinero es difícil de conseguir.','Esta dificultad para sentirme segura.','Esta dificultad para recibir.','Esta culpa que a veces siento con el dinero.','Todo este peso que llevo con este tema.']),
      R('Permitir', ['Me permito sentir este miedo sin juzgarme.','Me permito reconocer esta inseguridad.','Me permito soltar la exigencia de tenerlo todo resuelto.','Me permito aceptar cómo me siento hoy con esto.','Me permito bajar la lucha, aunque sea un poco.','Me permito recibir, aunque me cueste.','Me permito soltar parte de esta carga.','Me permito estar en paz con este proceso.']),
      R('Regular', ['Elijo sentirme más en calma con este tema.','Elijo respirar antes de reaccionar al miedo.','Elijo sentirme más segura, paso a paso.','Elijo un pensamiento más tranquilo sobre el dinero.','Elijo estar presente, no en el miedo futuro.','Elijo confiar en mi capacidad de resolver.','Elijo soltar la urgencia.','Elijo sentir más calma con este tema, hoy.']),

    ],
    apertura:['Me permito ir sintiendo más seguridad económica.','Me permito ver nuevas posibilidades.','Me permito soltar la creencia de la escasez.','Me permito aprender formas nuevas de manejar el dinero.','Me permito pedir ayuda o información cuando la necesito.','Me permito construir esto paso a paso.','Me permito sentirme más tranquila con mis finanzas.','Me permito confiar en mi propio proceso.'],
    cierre:['Puedo relacionarme de forma más tranquila con el dinero.','Puedo tomar decisiones económicas con más calma.','Puedo aprender y mejorar con el tiempo.','Puedo sentirme más segura, poco a poco.','Puedo soltar la exigencia de tenerlo todo resuelto ya.','Puedo confiar en mi capacidad de salir adelante.','Ya no tengo que cargar esto sola.','Elijo avanzar hacia más estabilidad y calma.'],

  {
    id:'ansiedad', name:'Empezar el día con energía positiva', color:'#4A2442', photo:'ansiedad.jpg',
    intro:'Cómo empiezas el día marca el tono de todo lo demás. Esta sesión es un ritual corto para arrancar desde la confianza y la energía positiva, en vez de la prisa.',
    desc:'Un ritual corto para empezar el día desde la confianza.',
    introScript:'Lleva una mano al pecho y la otra al abdomen. Inhala profundo y solo por nariz, empezando a entrar en tu respiración. Decide cerrar los ojos para conectar con las latencias de tu pecho, y sigue inhalando y exhalando por nariz, disfrutando de este momento para ti. Ahora decido abrir los ojos.',
    karate:'Empezamos haciendo tapping en el punto kárate. Hoy elijo sentirme segura en contacto con mi cuerpo, en contacto con la abundancia, atrayendo las fuentes ideales para mí. Hoy elijo confiar profundamente en mi capacidad de generar de manera estable y cada vez más armoniosa las cosas que más me gusta hacer.',
    outroScript:'Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación. Inhala profundo, deja que te caiga toda la energía en el centro de tu pecho, puedes juntar las palmas. Si viene un bostezo o lágrimas, déjalo salir. Llénate de luz, una luz blanca que te envuelve, te protege y te llena de toda la paz y el amor que habitan en ti. Que tengas un día maravilloso.',
    rounds:[
      R('Confiar en las circunstancias ideales',
        ['Empezamos en el inicio de la ceja con elijo generar las circunstancias ideales para mí a nivel laboral, a nivel personal, a nivel económico.','Al lado del ojo, sabiendo que soy capaz y eligiendo relajarme en la confianza de que este momento, de que este trabajo, de que este día va a fluir de manera perfecta y constante para mí.','Debajo del ojo, de maneras ricas, creativas, abundantes y con crecientes reconocimientos.','Bajo la nariz, porque a medida que yo crezco en experiencia, en confianza y en seguridad en mí misma, el mundo me va a estar entregando las fuentes ideales para mí.','En la barbilla, confiando cada vez más en todo lo que soy, en todo lo que pude y en todo lo que no pude, y aceptando todo tal y como es.','En la clavícula, aunque no sepa cómo hacerlo, aunque no esté teniendo el mejor de los días o esta no sea mi mejor semana.','Debajo del brazo, yo elijo confiar y conectarme con toda la energía positiva que habita en mí.','Y en la coronilla, porque sí es posible y merezco la vida que deseo.'],
        'Muy bien, ahora recorremos todos los puntos.'),

  {
    id:'jornada', name:'Amor propio', color:'#8F2F0E', photo:'fin%20de%20jornada.jpg',
    intro:'El amor propio no es algo que se decreta una vez, es algo que se practica. Esta sesión te lleva a reconocerte con más ternura y menos exigencia.',
    desc:'Para practicar el amor propio, sin exigencia.',
    introScript:'Vas a centrarte en lo que sientes, en tu cuerpo, en tu propio ser. No respondas a los estímulos de fuera, sino que te regalas este espacio y este tiempo para ti, para soltar, sanar y conectarte con el amor hacia ti misma. Cierra los ojos, inhala profundo y exhala suavemente, regalándote este instante de presencia.',
    karate:'Empezamos haciendo tapping en el punto kárate. Aunque a veces me cueste reconocerme con ternura, aunque cargue con exigencias o dudas sobre mi propio valor, elijo abrazarme exactamente tal y como soy hoy. Aunque en ocasiones olvide mi propia valía y me cueste habitarme desde la compasión, decido aceptarme de forma completa, con mis luces y mis sombras. Y a pesar de cualquier juicio del pasado, elijo amarme, perdonarme y darme el permiso de empezar a tratarme con el cuidado y el respeto que merezco.',
    outroScript:'Me permito pedir ayuda cuando lo necesito y me creo capaz de merecerlo. Me siento merecedora de recibir el amor y comprensión mío y de los demás. Cada día el amor que siento por mí, el reconocimiento y la admiración crece a cada paso. Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación. Inhala y exhala. Una vez más, inhala y exhala. Quédate con esta certeza en tu interior y llénate de todo el amor que habita en ti.',
    rounds:[
      R('Merecer amor',
        ['Empezamos en el inicio de la ceja con merezco amor y recibirlo todos los días.','Al lado del ojo, soy digna de ser amada.','Debajo del ojo, mi amor propio es inquebrantable.','Bajo la nariz, mi amor propio me guía a tomar decisiones saludables.','En la barbilla, me amo y espero un trato digno y con respeto de los demás.','En la clavícula, me permito liberar cualquier pensamiento negativo acerca de quién soy, cómo me veo o cómo pienso.','Debajo del brazo, soy una persona valiosa y merezco todas las bondades de la vida.','Y en la coronilla, me permito ser vulnerable e incluso amarme con todos mis defectos.'],
        'Muy bien, ahora recorremos todos los puntos.'),
      R('Confiar en mí',
        ['Mi valor no depende de la aprobación de los demás.','Confío en mí misma y en mi intuición.','Me permito disfrutar de quién soy, de cómo pienso y de mis gustos.','Creo en mi capacidad para superar cualquier acontecimiento que pueda ponerme a prueba.','Confío en mis capacidades y en mis habilidades.','Confío en que cuando cometo errores y fallo, también estoy aprendiendo y es parte de la vida.','Soy capaz de perdonarme y liberarme de cualquier culpa o remordimiento del pasado.','Me amo lo suficiente como para cuidar mi bienestar y mi cuerpo.'],
        'Pasamos a la segunda ronda, comenzando en el inicio de la ceja y recorriendo cada punto a tu propio ritmo, recordando que no existen normas fijas y que todo está bien.'),
      R('Brillar sin miedo',
        ['Soy un ser único e irrepetible.','Cada día me siento más segura y confiada conmigo misma.','Soy merecedora de todas las cosas buenas que la vida me brinda.','Me permito brillar y ser admirada.','Me permito brillar sin miedo al juicio.','Mi amor propio me impulsa a buscar oportunidades de crecimiento.','Me amo tanto a mí misma que soy capaz de soltar a aquellos que no saben amar.','Mi amor propio no depende de ninguna circunstancia externa.']),
      R('Cuidarme con compasión',
        ['Me permito celebrar mis éxitos y aprender de mis errores.','Acepto, valoro y admiro cada parte de mí sin importar sus defectos.','Merezco tratarme con cuidado y con compasión.','Me siento merecedora de recibir cosas buenas.','Merezco amarme y ser amada.','Mi amor propio me impulsa a establecer metas y confiar en que puedo lograrlas.','Me permito expresar mis necesidades y deseos sin culpa.','Mi amor propio me protege en las situaciones difíciles.']),

  {
    id:'accion', name:'Acción inspirada', color:'#4A2442', photo:'estres.jpg',
    intro:'Actuar desde la prisa y la exigencia agota igual que no actuar en absoluto. Esta sesión trabaja esa relación con la acción, para moverte desde la calma en vez de la urgencia.',
    desc:'Para actuar desde la calma en vez de la urgencia o el bloqueo.',
    introScript:'Vas a centrarte en lo que sientes, en tu cuerpo, en tu propio ser. No respondas a los estímulos de fuera, sino que te regalas este espacio y este tiempo para ti, para soltar, sanar y conectarte con el flujo infinito de la abundancia.',
    karate:'Empezamos haciendo tapping en el punto kárate. Aunque en ocasiones actúas de forma muy impulsiva, hasta con desesperación, urgencia y prisas, o al contrario, te paralizas por completo y no haces nada, aun así eliges amarte y aceptarte tal y como eres. Aunque a veces te muevas desde la desesperación, la prisa y la preocupación, o el bloqueo sea tan fuerte que te impida actuar, decides amarte y aceptarte de forma incondicional exactamente como eres. Y aunque a veces te conduzcas desde la urgencia o te quedes completamente bloqueada sin hacer nada, o mucho menos de lo que serías capaz, a pesar de ello eliges no juzgarte, no criticarte ni culparte, y simplemente aceptas que somos humanos y que estás haciendo lo mejor que puedes.',
    outroScript:'Tienes la oportunidad de ejercitarte en escuchar esos mensajes y aquello que percibes para identificar su procedencia. Y en el momento en que prestas atención a tu corazón y a tu intuición, te sitúas firmemente en el camino adecuado. Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación tan grata. Este proceso no se limita simplemente a tranquilizarnos un poco; estamos transformando de raíz la manera en que percibimos el mundo y la forma en que nos abrimos a recibir la mejor abundancia que existe. Gracias, gracias, gracias.',
    rounds:[
      R('Reconocer la urgencia o el bloqueo',
        ['Empezamos en el inicio de la ceja con esta conducta que a veces brota de la urgencia.','Al lado del ojo, con estas acciones desesperadas.','Debajo del ojo, con esos momentos en los que tal vez actuamos por puro impulso, sin concedernos un instante para pausar.','Bajo la nariz, con ese hacer constante y mecánico sin prestar atención a cómo nos sentimos en realidad.','En la barbilla, con la tendencia a actuar desde la preocupación, el miedo, el estrés y la autoexigencia.','En la clavícula, con esa parálisis en la que el bloqueo es tan fuerte que ni siquiera logramos hacer lo que nos corresponde, dando pie después al sentimiento de culpa.','Debajo del brazo, con todas esas acciones que no están ejecutadas desde el equilibrio.','Y en la coronilla, con esa fuerza interna que nos empuja a veces a movernos de formas tan desesperadas.'],
        'Muy bien, ahora recorremos todos los puntos.'),
      R('Soltar la prisa',
        ['Decides dejar ir todas estas prisas.','Eliges liberarte de cualquier clase de autoexigencia.','Decides soltar cualquier temor o preocupación.','Optas también por despojarte del exceso de pensamientos y de carga mental.','Y si quedara algún vestigio de culpa, también elegimos liberarlo en este mismo instante.','Estamos llevando a cabo una limpieza profunda, una depuración energética de todo tu ser para que logres reencontrar el equilibrio y reconectarte con tu verdadera esencia.','¿Por qué comenzaste a hacer esto en su momento? Lo probable es que lo iniciaras porque te apasionaba, porque lo disfrutabas y porque sentías que era lo correcto.','Vamos a regresar a ese origen, a gozar con lo que hacemos, incluso aunque no quede perfecto, sabiendo que la perfección absoluta no existe.'],
        'Pasamos a la segunda ronda, comenzando en el inicio de la ceja y recorriendo cada punto a tu propio ritmo, recordando que no existen normas fijas y que todo está bien.'),
      R('Actuar desde el fluir',
        ['Así que, ya que nos toca estar aquí y asumir esto, hagámoslo de la manera más óptima posible, desde la paz y la serenidad.','Nos ponemos en acción, nos movemos, se activa la energía vital, hay movimiento, dinamismo, vitalidad y vida, pero desde la calma y el fluir.','Y es entonces cuando todo fluye y sale muchísimo mejor.','Es como si todo fluyera, las piezas se recolocaran por sí solas, hallaras aquello que buscabas y descubrieras que las situaciones resultan mucho más sencillas de lo que creías; la gente te echa una mano, te sientes mejor y cada vez sale todo mejor.','Y si en algún momento te inquietas y las cosas vuelven a torcerse, no pasa nada, simplemente regresas a tu centro de calma y presencia.','Cuentas con estas maravillosas herramientas de tapping para reencontrarte contigo y volver a actuar desde la serenidad.','Además, dentro de ti habita una intuición, puedes llamarla intuición, Dios, el subconsciente colectivo o como prefieras, que actúa a modo de brújula o guía para indicarte cómo moverte.','Y cuando te encuentras en un estado de paz y confianza, esos mensajes se manifiestan con total claridad: si te transmiten una sensación de expansión, provienen de ese lugar elevado; si te generan contracción, temor o prisa, entonces proceden del miedo.']),

  {
    id:'centro', name:'Ansiedad', color:'#354A24', photo:'volver%20a%20mi%20centro.jpg',
    intro:'Hay noches y momentos en que la ansiedad se instala en el cuerpo entero. Esta sesión te acompaña a bajar esa activación, un punto a la vez.',
    desc:'Para cuando la ansiedad se siente en todo el cuerpo.',
    introScript:'Vas a centrarte en lo que sientes, en tu cuerpo, en tu propio ser. No respondas a los estímulos de fuera, sino que te regalas este espacio y este tiempo para ti, para soltar, sanar y conectarte con la calma.',
    karate:'Empezamos haciendo tapping en el punto kárate. Aunque siento esta ansiedad en todo mi cuerpo, aunque mi mente no deja de dar vueltas y a veces me cuesta respirar, me acepto total y completamente. Aunque experimente esta tensión y estos pensamientos que no me dejan en paz, decido amarme y aceptarme de forma incondicional exactamente como eres. Y aunque a veces el estrés y la agitación se apoderen de mí, a pesar de ello elijo no juzgarte, no criticarte ni culparte, y simplemente aceptas que somos humanos y que estás haciendo lo mejor que puedes.',
    outroScript:'Yo me amo, tengo todas las posibilidades de cambiar y toda la facilidad también, lo estoy haciendo ahora. Gracias gracias gracias. Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación tan grata. Fíjate cómo está tu cuello, fíjate si algo cambió, si necesitas hacerte algún masaje, algún movimiento en la cabeza. Es maravilloso. Si puedes, regálate una meditación, tómate algo rico, alguna infusión, y agradece cinco cosas de tu día y de tu vida. Y cada vez que te sientas ansiosa, recuerda que no eres esa emoción, que simplemente estás siendo ansiosa en ese momento, y que así como puedes estarlo, puedes dejar de estarlo para empezar a cambiar así tus días y tu vida.',
    rounds:[
      R('Reconocer la ansiedad en el cuerpo',
        ['Empezamos en el inicio de la ceja con esta ansiedad que siento en todo mi cuerpo.','Al lado del ojo, con estos pensamientos que no me dejan en paz.','Debajo del ojo, con esta mente que siento turbulenta.','Bajo la nariz, con todo lo que me queda de ansiedad en el cuerpo y en mi mente.','En la barbilla, con la tendencia a actuar desde la preocupación, el miedo y el estrés.','En la clavícula, con esa sensación de agobio que a veces me paraliza.','Debajo del brazo, con todas esas tensiones acumuladas.','Y en la coronilla, con esa fuerza interna que me pide bajar el ritmo.'],
        'Muy bien, ahora recorremos todos los puntos.'),
      R('Elegir la calma',
        ['Decides dejar ir toda esta ansiedad.','Elijo en este momento estar confiada y tranquila.','Sé que es posible para mí estar más tranquila en este momento.','Puedo respirar, tomarme un descanso, una respiración, y ya noto y puedo percibir cómo mi cuerpo se calma.','Y si quedara algún vestigio de tensión, también elegimos liberarlo en este mismo instante.','Estamos llevando a cabo una limpieza profunda, una depuración energética de todo tu ser para que logres reencontrar el equilibrio y reconectarte con tu verdadera esencia.','Hoy elijo poder confiar en mi cuerpo y crear toda la confianza y la seguridad de poder sanarme y habitar en la calma y en la paz.','Puedo realizar todas mis tareas con facilidad y en calma.'],
        'Pasamos a la segunda ronda, comenzando en el inicio de la ceja y recorriendo cada punto a tu propio ritmo, recordando que no existen normas fijas y que todo está bien.'),
      R('Habitar la paz',
        ['Toda la paz habita en mí.','Es como si todo fluyera, las piezas se recolocaran por sí solas, hallaras aquello que buscabas y descubrieras que las situaciones resultan mucho más sencillas de lo que creías.','Gracias, gracias porque ya me siento mucho mejor.','Gracias porque estoy creando seguridad y confianza en mí.','Gracias porque me tomé este respiro y este aire para poder estar mejor y poder pensar diferente.','Puedo encontrar solución rápida a todo lo que me pasa.','Sé que, aunque sienta ansiedad, puedo actuar rápidamente a mi favor eligiendo respirar, tomarme un descanso, hacer algo bueno para mí.','El tapping me ayuda, respirar me hace muy bien, me siento en calma y totalmente agradecida por todo lo que estoy haciendo para mí.']),

  {
    id:'dormir', name:'Dormir', color:'#8F2F0E', photo:'dormir.jpg',
    intro:'Hay noches en que el cuerpo está agotado pero la mente sigue trabajando horas extra. Vamos a hablarle directamente a esa parte tuya que no se apaga, hasta que empiece a soltar.',

    karate:'Empezamos haciendo tapping en el punto kárate. Aunque siento este cansancio en todo mi cuerpo, aunque doy vueltas en la cama y la mente no se apaga, me acepto total y completamente. Aunque experimente este agotamiento que no me deja dormir, decido amarme y aceptarme de forma incondicional exactamente como eres. Y aunque a veces el estrés y la frustración de no descansar se apoderen de mí, a pesar de ello elijo no juzgarte, no criticarte ni culparte, y simplemente aceptas que somos humanos y que estás haciendo lo mejor que puedes.',
    outroScript:'Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación de quietud. Acuéstate boca arriba, con las palmas de las manos hacia arriba, y empieza a relajarte todo lo que puedas. Permítete crear tu espacio de sueño profundo y reparador, sabiendo que cada día te resulta más fácil conectar con la calma. Descansa plácidamente.',
    rounds:[
      R('Reconocer el cansancio',
        ['Empezamos en el inicio de la ceja con este cansancio que tengo, este no poder dormir.','Al lado del ojo, con esta sensación de estar muy cansada porque las horas pasan y sigo despierta.','Debajo del ojo, con este agobio y este estrés acumulado en todo mi cuerpo.','Bajo la nariz, con todos estos pensamientos negativos que no me dejan en paz.','En la barbilla, con la tendencia a actuar desde la preocupación y la exigencia mental.','En la clavícula, con esa sensación de frustración por no lograr conciliar el sueño.','Debajo del brazo, con todas esas tensiones del día que todavía sostengo.','Y en la coronilla, con esa fuerza interna que me pide parar y soltar.'],
        'Muy bien, ahora recorremos todos los puntos.'),

      R('Agradecer el descanso',
        ['Gracias porque me tomé este respiro para cuidar de mí.','Puedo encontrar la calma rápida a todo lo que me pasa.','Sé que, aunque cueste dormir, puedo actuar a mi favor eligiendo respirar, soltar las pantallas, crear un espacio de tranquilidad a mi alrededor y regalarme este momento de paz.','Yo me amo, tengo todas las posibilidades de descansar profundamente y lo estoy haciendo ahora.','Gracias gracias gracias.']),

  {
    id:'miedo', name:'Miedo', color:'#742E0E', photo:'miedo.jpg',
    intro:'El miedo no siempre avisa antes de aparecer, y a veces se instala en el cuerpo antes de que la mente entienda por qué. Esta sesión te acompaña a atravesarlo, sin exigirte que desaparezca de golpe.',
    desc:'Para cuando el miedo se siente grande o paralizante.',
    introScript:'Cierra los ojos y empieza a soltar esos hombros. Inhala, lleva los hombros hacia arriba y exhala. Deja que todo ese miedo empiece a sentirse en el cuerpo, visualizando ese momento, esa palabra o esa situación que te genera miedo. Inhala profundo y exhala ese miedo y esa incomodidad, siéntela en el cuerpo. Reconoce, siente y percibe ese miedo; hoy vas a animarte a abrazarlo, a sentir todo lo que pasa en el cuerpo en esa situación.',
    karate:'Empezamos haciendo tapping en el punto kárate. Aunque siento este miedo en todo mi cuerpo, aunque a veces se apodera de mí y me impide moverme o animarme a lo nuevo, me acepto total y completamente. Aunque experimente este temor, este pánico o esa opresión en la panza que tantas veces detiene mis pasos, decido amarme y aceptarme de forma incondicional exactamente como eres. Y aunque a veces el miedo sea tan grande que me paralice, a pesar de ello elijo no juzgarte, no criticarte ni culparte, y simplemente aceptas que es normal sentir miedo, que somos humanos y que estás haciendo lo mejor que puedes.',
    outroScript:'Perfecto, ahora vamos a detener el tapping y a permanecer unos instantes disfrutando de esta sensación de poder y presencia. Lleva tus manos a los hombros, date unos golpecitos suaves en los omóplatos y respira hondo. Recuerda que donde hay amor no existe el miedo. Cierra los ojos unos segundos y visualízate haciendo eso que tanto deseas, lográndolo con total seguridad, porque si puedes crearlo en tu mente, lo tendrás en tu vida.',
    rounds:[
      R('Reconocer el miedo',
        ['Empezamos en el inicio de la ceja con este miedo que siento.','Al lado del ojo, con este temor que está siempre en mis pensamientos.','Debajo del ojo, con este miedo que tanto me limita.','Bajo la nariz, con esa situación que no puedo aceptar y que tanto me impide hacer.','En la barbilla, con el miedo a fracasar y a no poder lograrlo al intentarlo.','En la clavícula, con ese pánico que me paraliza y me deja sin aire.','Debajo del brazo, con todo este temblor y esta incomodidad que cargo.','Y en la coronilla, con esa fuerza interna que hoy decide mirar el miedo de frente.'],

function estimateMinutes(cat, seconds){
  const total = 4 + cat.rounds.reduce((s,r)=>s+r.phrases.length,0) + cat.apertura.length + cat.cierre.length;
  return Math.max(1, Math.round((total*seconds)/60));
}

function buildDiagramHTML(activeKey){
  const allPoints = [...POINT_META, KARATE_META];
  const p = allPoints.find(pt => pt.key === activeKey);

  const dot = `<div class="pt-dot active" style="left:${p.x}%;top:${p.y}%;"></div>`;
  return `<div class="diagram-wrap"><img src="${DIAGRAM_IMG}" alt="Puntos de tapping">${dot}</div>`;
}

function renderThermometer(container, value, onChange){
  container.innerHTML = '';
  const wrap = el('div',{class:'thermo-block'});
  const valueEl = el('div',{class:'thermo-value'}, String(value));
  const track = el('div',{class:'thermo-track'});
  const labels = el('div',{class:'thermo-labels'});
  for(let i=10;i>=0;i--){ labels.appendChild(el('span',{}, String(i))); }
  const fillBar = el('div',{class:'thermo-fill'});
  const thumb = el('div',{class:'thermo-thumb'});
  track.appendChild(fillBar); track.appendChild(thumb);

  function setVal(v){
    v = Math.max(0, Math.min(10, v));
    valueEl.textContent = String(v);
    const pct = (v/10)*100;
    fillBar.style.height = pct+'%';
    thumb.style.bottom = pct+'%';
    onChange(v);
  }
  let dragging = false;
  function posToVal(clientY){
    const rect = track.getBoundingClientRect();
    const pct = 1 - Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
    return Math.round(pct*10);
  }
  track.addEventListener('pointerdown',(e)=>{ dragging=true; setVal(posToVal(e.clientY)); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove',(e)=>{ if(dragging) setVal(posToVal(e.clientY)); });
  track.addEventListener('pointerup',()=>{ dragging=false; });

  wrap.appendChild(valueEl);
  const row = el('div',{class:'thermo-row'});
  row.appendChild(labels); row.appendChild(track);
  wrap.appendChild(row);
  container.appendChild(wrap);
  setVal(value);
}

function renderThermometerHorizontal(container, value, onChange){

  container.appendChild(wrap);
}

/* =================== DOM helpers =================== */
const app = document.getElementById('app');
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

/* =================== Audio cues =================== */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq=520, dur=0.09, vol=0.05){
  if(!actx) return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.frequency.value = freq; o.type='sine';
  g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur + 0.02);
}
function chime(){ beep(660,0.12,0.06); setTimeout(()=>beep(880,0.15,0.05),110); }

/* =================== Build full step sequence for a category =================== */
function resolveRoundStep(round, item, idx){
  if(typeof item === 'string'){
    const meta = POINT_META[idx];
    return {phase:'round', roundTitle:round.title, key:meta.key, name:meta.name, where:meta.where, phrase:item};
  }
  const meta = item.key ? POINT_META.find(p=>p.key===item.key) : null;
  return {phase:'round', roundTitle:round.title, key:item.key||null, name: meta?meta.name:round.title, where: meta?meta.where:'', phrase:item.phrase};
}

function buildSequence(cat){
  if(cat.segments){ return buildFreeformSteps(cat); }
  const steps = [];
  // karate phase: 4 reps
  for(let i=0;i<4;i++){
    steps.push({phase:'karate', repIndex:i, repTotal:4, key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  }
  cat.rounds.forEach((round)=>{
    if(round.transition){
      steps.push({phase:'transition', key:null, name:round.title, where:'', phrase:round.transition});
    }
    round.phrases.forEach((item, idx)=>{
      steps.push(resolveRoundStep(round, item, idx));
    });
  });
  if(cat.apertura && cat.apertura.length){
    steps.push(...buildExtraSequence(cat.apertura, 'apertura'));
  }
  if(cat.cierre && cat.cierre.length){
    steps.push(...buildExtraSequence(cat.cierre, 'cierre'));
  }
  return steps;
}
function buildExtraSequence(phrases, phaseLabel){
  return phrases.map((phrase, idx)=>({phase:phaseLabel, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase}));
}

function buildQuickSequence(cat){
  const steps = [];
  for(let i=0;i<2;i++){
    steps.push({phase:'karate', repIndex:i, repTotal:2, key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  }
  const round = cat.rounds[0];
  round.phrases.forEach((phrase, idx)=>{
    steps.push({phase:'round', roundTitle:round.title, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase});
  });
  return steps;
}

function buildFreeformSteps(cat){
  return cat.segments.map(seg => ({phase:'freeform', key:null, name:seg.title, where:'', phrase:seg.text}));
}

function buildAudioSteps(cat){
  if(cat.segments){ return buildFreeformSteps(cat); }
  const steps = [];
  if(cat.audio && cat.audio.hasIntro && cat.introScript){
    steps.push({phase:'intro', key:'intro', name:'Introducción', where:'', phrase:cat.introScript});
  }
  steps.push({phase:'karate', key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  cat.rounds.forEach((round)=>{
    if(round.transition){
      steps.push({phase:'transition', key:null, name:round.title, where:'', phrase:round.transition});
    }
    round.phrases.forEach((item, idx)=>{
      steps.push(resolveRoundStep(round, item, idx));
    });
  });
  steps.push(...buildExtraSequence(cat.apertura,'apertura'));
  steps.push(...buildExtraSequence(cat.cierre,'cierre'));
  if(cat.audio && cat.audio.hasOutro && cat.outroScript){
    steps.push({phase:'outro', key:'outro', name:'Cierre de la sesión', where:'', phrase:cat.outroScript});
  }
  return steps;
}

function startAudioSlice(cat, startIdx, endIdxExclusive, onFinish){
  const allSteps = buildAudioSteps(cat);
  const allTs = cat.audio.timestamps;
  const steps = allSteps.slice(startIdx, endIdxExclusive);
  const timestamps = allTs.slice(startIdx, endIdxExclusive);
  const sliceEndTime = allTs[endIdxExclusive] !== undefined ? allTs[endIdxExclusive] : null;
  clearTimer();
  const audioEl = new Audio(cat.audio.file);
  playerCtx = { mode:'audio', steps, timestamps, index:0, paused:false, audioEl, onFinish, sliceEndTime };
  audioEl.currentTime = timestamps[0];
  renderPlayerFrame(true);
  audioEl.ontimeupdate = ()=>{
    if(!playerCtx || playerCtx.audioEl!==audioEl) return;
    const t = audioEl.currentTime;
    if(playerCtx.sliceEndTime!==null && t>=playerCtx.sliceEndTime){
      audioEl.ontimeupdate = null;
      audioEl.pause();
      playerCtx.onFinish();
      return;
    }
    let ni = playerCtx.index;
    while(ni+1<playerCtx.timestamps.length && t>=playerCtx.timestamps[ni+1]) ni++;
    if(ni!==playerCtx.index){ playerCtx.index=ni; renderPlayerFrame(false); }
    updateAudioProgressBar();
  };
  audioEl.onended = ()=>{ if(playerCtx && playerCtx.audioEl===audioEl) playerCtx.onFinish(); };
  audioEl.play();
}

function updateAudioProgressBar(){
  const fill = document.getElementById('progFill');
  if(!fill || !playerCtx || playerCtx.mode!=='audio') return;
  const cur = playerCtx.timestamps[playerCtx.index];
  const next = playerCtx.index+1 < playerCtx.timestamps.length ? playerCtx.timestamps[playerCtx.index+1] : playerCtx.sliceEndTime;
  const t = playerCtx.audioEl.currentTime;
  if(next==null || next<=cur){ fill.style.width='0%'; return; }
  const pct = ((t-cur)/(next-cur))*100;
  fill.style.width = Math.max(0,Math.min(100,pct))+'%';
}


function startPlayer(steps, onFinish){
  ensureAudio();
  playerCtx = { steps, index:0, paused:false, secondsLeft:settings.seconds, onFinish };
  renderPlayerFrame(true);
  runTick();
}
function runTick(){
  clearTimer();
  timerHandle = setInterval(()=>{
    if(!playerCtx || playerCtx.paused) return;
    playerCtx.secondsLeft -= 0.1;
    if(playerCtx.secondsLeft <= 0){
      advancePlayer();
    } else {
      updateProgressBar();
    }
  }, 100);
}
function advancePlayer(){
  const isNewRound = playerCtx.index < playerCtx.steps.length-1 &&
    playerCtx.steps[playerCtx.index].roundTitle !== playerCtx.steps[playerCtx.index+1]?.roundTitle;
  playerCtx.index++;
  if(playerCtx.index >= playerCtx.steps.length){
    clearTimer();
    chime();
    playerCtx.onFinish();
    return;
  }
  beep(isNewRound ? 740 : 520, isNewRound?0.14:0.08, isNewRound?0.06:0.045);
  playerCtx.secondsLeft = settings.seconds;
  renderPlayerFrame(false);
}
function togglePause(){
  if(!playerCtx) return;
  if(playerCtx.mode==='audio'){
    if(playerCtx.audioEl.paused){ playerCtx.audioEl.play(); } else { playerCtx.audioEl.pause(); }
  } else {
    playerCtx.paused = !playerCtx.paused;
  }
  const btn = document.getElementById('pauseBtn');
  const isPaused = playerCtx.mode==='audio' ? playerCtx.audioEl.paused : playerCtx.paused;
  if(btn) btn.textContent = isPaused ? '▶' : '❚❚';
}
function skipPoint(){
  if(!playerCtx) return;
  if(playerCtx.mode==='audio'){
    const next = playerCtx.index+1 < playerCtx.timestamps.length ? playerCtx.timestamps[playerCtx.index+1] : playerCtx.sliceEndTime;
    if(next==null){ playerCtx.audioEl.pause(); playerCtx.onFinish(); }
    else {
      playerCtx.audioEl.currentTime = next;
      const p = playerCtx.audioEl.play();
      if(p && p.catch) p.catch(()=>{});
    }
  } else {
    advancePlayer();
  }
}
function exitPlayer(){
  clearTimer();
  if(playerCtx && playerCtx.mode==='audio' && playerCtx.audioEl){
    playerCtx.audioEl.ontimeupdate = null;
    playerCtx.audioEl.onended = null;
    playerCtx.audioEl.pause();
  }
  playerCtx=null;
  goto('home');
}

function updateProgressBar(){
  const fill = document.getElementById('progFill');
  if(!fill || !playerCtx) return;
  const pct = 100 - (playerCtx.secondsLeft/settings.seconds)*100;
  fill.style.width = Math.max(0,Math.min(100,pct))+'%';
}

function renderPlayerFrame(isFirst){
  const cat = state.category;
  const step = playerCtx.steps[playerCtx.index];
  const wrap = el('div',{class:'player'});

  const top = el('div',{class:'player-top'});
  top.appendChild(el('button',{class:'exit',onclick:exitPlayer},'×'));
  const phaseLabel = step.phase==='intro' ? 'Introducción'
    : step.phase==='karate' ? 'Preparación'
    : step.phase==='transition' ? step.name
    : step.phase==='round' ? step.roundTitle
    : step.phase==='apertura' ? 'Ronda de apertura'
    : step.phase==='outro' ? 'Cierre de la sesión'
    : 'Cierre';
  top.appendChild(el('span',{class:'phase-label'}, phaseLabel));
  top.appendChild(el('span',{style:'width:22px'}));
  wrap.appendChild(top);

  wrap.appendChild(el('div',{class:'progress-track'}, el('div',{class:'progress-fill',id:'progFill'})));

  const mid = el('div',{class:'player-mid'});
  if(step.phase==='karate' && step.repIndex!==undefined && step.repTotal!==undefined){
    mid.appendChild(el('div',{class:'rep-count'}, `Repetición ${step.repIndex+1} de ${step.repTotal}`));
  }
  const diagramHolder = el('div',{html: buildDiagramHTML(step.key)});
  mid.appendChild(diagramHolder);
  mid.appendChild(el('div',{class:'point-name'}, step.name));
  mid.appendChild(el('div',{class:'point-where'}, step.where));
  mid.appendChild(el('div',{class:'point-phrase'}, `"${step.phrase}"`));
  if(step.phase==='intro' && cat.audio && cat.audio.introAsksRating){
    const scaleHolder = el('div',{});
    mid.appendChild(scaleHolder);
    renderThermometerHorizontal(scaleHolder, state.sudBefore, (v)=>{ state.sudBefore = v; });
  }
  wrap.appendChild(mid);

  const controls = el('div',{class:'player-controls'});
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:togglePause,id:'pauseBtn'}, '❚❚'));
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:skipPoint}, '⏭'));
  wrap.appendChild(controls);

  if(step.phase==='intro'){
    wrap.appendChild(el('button',{class:'btn btn-ghost',style:'margin-top:14px;',onclick:skipPoint},'Saltar introducción →'));
  }

  app.replaceChildren(wrap);
}
