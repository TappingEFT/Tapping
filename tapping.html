<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro · Tapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --stone:#FFFFFF; --stone-deep:#EDE7DC; --ink:#141210; --ink-soft:#4A4438;
    --sienna:#B23D14; --sienna-deep:#8F2F0E; --sage:#3E5A2E; --sage-deep:#2F4522;
    --plum:#5A2E52; --card:#FAF6EE; --line:rgba(20,18,16,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:#FFFFFF;color-scheme:light;}
  html,body{margin:0;padding:0;}
  body{background:var(--stone);color:var(--ink);font-family:'Source Sans 3',Arial,sans-serif;font-size:18px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Source Sans 3',Arial,sans-serif;font-weight:700;margin:0;letter-spacing:0;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--stone);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 6px;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;font-family:'Source Sans 3',sans-serif;padding:6px 0;cursor:pointer;}
  .back-btn:active{opacity:0.6;}

  .home-header{padding:8px 24px 4px;}
  .home-header .eyebrow{color:var(--sienna-deep);font-size:16px;margin-bottom:6px;font-weight:600;}
  .home-header h1{font-size:36px;}
  .home-header p{color:var(--ink-soft);font-size:18px;line-height:1.55;margin-top:10px;max-width:34ch;}

  .grid{padding:16px 20px 8px;display:flex;flex-direction:column;gap:14px;}
  .cat-card{position:relative;border-radius:10px;overflow:hidden;height:120px;cursor:pointer;display:flex;align-items:flex-end;border:1px solid var(--line);}
  .cat-card:active{transform:scale(0.98);}
  .cat-card .cat-overlay{position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0.15) 55%, rgba(0,0,0,0.05) 100%);}
  .cat-card .cat-text{position:relative;padding:14px 16px;color:#fff;width:100%;}
  .cat-card .cat-text h3{font-size:19px;color:#fff;margin-bottom:3px;}
  .cat-card .cat-text span{font-size:14px;color:rgba(255,255,255,0.88);}

  .intro-card{margin:0 20px 4px;padding:18px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;gap:14px;cursor:pointer;}
  .intro-card:active{background:var(--stone-deep);}
  .intro-card .dot{width:40px;height:40px;border-radius:50%;background:var(--sienna);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .intro-card h3{font-size:17px;margin-bottom:2px;}
  .intro-card span{font-size:14px;color:var(--ink-soft);}

  .thermo-block{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .thermo-value{font-size:44px;font-weight:700;}
  .thermo-row{display:flex;align-items:stretch;gap:16px;height:260px;}
  .thermo-labels{display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--ink-soft);font-weight:600;padding:2px 0;}
  .thermo-track{position:relative;width:14px;background:var(--stone-deep);border:2px solid var(--line);border-radius:8px;touch-action:none;}
  .thermo-fill{position:absolute;bottom:0;left:0;right:0;background:var(--sienna);border-radius:0 0 6px 6px;height:0%;}
  .thermo-thumb{position:absolute;left:50%;bottom:0%;width:30px;height:30px;background:#fff;border:3px solid var(--sienna);border-radius:50%;transform:translate(-50%,50%);}

  .diagram-wrap{position:relative;width:190px;margin:0 auto 8px;border-radius:10px;overflow:hidden;}
  .diagram-wrap img{width:100%;display:block;}
  .pt-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.85);transform:translate(-50%,-50%);}
  .pt-dot.active{width:16px;height:16px;background:var(--sienna);border:2px solid #fff;animation:ptpulse 1.3s ease-out infinite;}
  @keyframes ptpulse{
    0%{box-shadow:0 0 0 0 rgba(178,61,20,0.55);}
    70%{box-shadow:0 0 0 16px rgba(178,61,20,0);}
    100%{box-shadow:0 0 0 0 rgba(178,61,20,0);}
  }

  .settings-row{margin:6px 20px 4px;padding:16px;border:2px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--ink);}
  .seg{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:8px 14px;font-size:16px;color:var(--ink);cursor:pointer;}
  .seg button.active{background:var(--sienna);color:#fff;}

  .hist-link{margin:6px 20px 0;padding:16px 18px;border:2px dashed var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--ink);font-size:16.5px;}
  .hist-link:active{opacity:0.6;}
  .footer-note{padding:16px 26px 34px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}

  .session-wrap{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .cat-tag{font-size:15px;color:var(--sienna-deep);margin-bottom:6px;font-weight:600;}
  .session-wrap h2{font-size:27px;margin-bottom:14px;}
  .stage-copy{color:var(--ink);font-size:17.5px;line-height:1.6;margin-bottom:22px;}

  .sud-row{display:flex;align-items:center;gap:14px;margin:8px 0 26px;}
  .sud-row input[type=range]{flex:1;accent-color:var(--sienna);height:8px;}
  .sud-value{font-size:34px;font-weight:700;min-width:40px;text-align:center;}

  .phrase-box{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px;}
  .phrase-box p{font-size:20px;font-weight:500;line-height:1.55;margin:0;}

  /* --- Player screen (hands-free) --- */
  .player{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .player-top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 4px;}
  .player-top .exit{background:none;border:none;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;}
  .player-top .phase-label{font-size:15px;color:var(--sienna-deep);font-weight:600;}

  .progress-track{height:6px;background:var(--stone-deep);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 30px;}
  .progress-fill{height:100%;background:var(--sienna);width:0%;transition:none;}

  .player-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
  .round-title{font-size:22px;font-weight:700;color:var(--ink);}
  .rep-count{font-size:15px;color:var(--ink);letter-spacing:0.03em;font-weight:600;}
  .point-name{font-size:34px;font-weight:700;margin-top:6px;color:var(--ink);}
  .point-where{font-size:17px;color:var(--ink-soft);margin-top:4px;}
  .point-phrase{font-size:23px;color:var(--sienna-deep);font-weight:600;line-height:1.5;margin-top:22px;max-width:26ch;}

  .timer-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;}
  .timer-ring span{font-size:17px;font-weight:700;}

  .player-controls{display:flex;justify-content:center;gap:18px;padding-top:22px;}
  .ctrl-btn{background:var(--card);border:2px solid var(--line);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);cursor:pointer;}
  .ctrl-btn:active{background:var(--stone-deep);}

  .btn{border:none;border-radius:6px;padding:18px 20px;font-size:18px;font-family:'Source Sans 3',sans-serif;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--sienna);color:#fff;}
  .btn-primary:active{background:var(--sienna-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px;}
  .btn-ghost:active{background:var(--stone-deep);}
  .spacer{flex:1;}

  .choice-row{display:flex;gap:10px;margin-top:6px;}
  .choice-row .btn{flex:1;}

  .end-summary{display:flex;justify-content:space-around;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:26px 12px;margin-bottom:20px;}
  .end-summary .num{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .end-summary .num strong{font-size:40px;font-weight:700;}
  .end-summary .num span{font-size:14px;color:var(--ink);}
  .end-summary .arrow{color:var(--ink);font-size:22px;}

  .hist-item{border-bottom:1px solid var(--line);padding:16px 2px;display:flex;justify-content:space-between;align-items:center;}
  .hist-item .l{display:flex;flex-direction:column;gap:2px;}
  .hist-item .l strong{font-size:17px;}
  .hist-item .l span{font-size:14px;color:var(--ink-soft);}
  .hist-item .r{font-size:17px;font-weight:700;color:var(--sienna-deep);}
  .empty-hist{color:var(--ink-soft);font-size:16px;padding:30px 4px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =================== Data =================== */
// Order matches the 8 tapping points used in every round (after the karate point).
const POINT_META = [
  {key:'ceja', name:'Ceja', where:'inicio de la ceja, junto al puente de la nariz', x:44, y:26.5},
  {key:'ladoOjo', name:'Lado del ojo', where:'hueso de la sien, junto al rabillo del ojo', x:60, y:28.5},
  {key:'debajoOjo', name:'Debajo del ojo', where:'sobre el hueso, bajo la pupila', x:56, y:33.5},
  {key:'debajoNariz', name:'Debajo de la nariz', where:'entre la nariz y el labio superior', x:50, y:33.5},
  {key:'barbilla', name:'Barbilla', where:'en el pliegue, entre el labio y la barbilla', x:50, y:36.5},
  {key:'clavicula', name:'Clavícula', where:'debajo de la unión de las clavículas', x:50, y:48.5},
  {key:'brazo', name:'Debajo del brazo', where:'unos 10 cm bajo la axila', x:88, y:51},
  {key:'coronilla', name:'Coronilla', where:'centro superior de la cabeza', x:50, y:15.5},
];
const KARATE_META = {key:'karate', name:'Canto de la mano', where:'lado exterior de la mano, bajo el meñique', x:50, y:66};
const DIAGRAM_IMG = 'mujer-tapping.jpg';

function R(title, phrases){ return {title, phrases}; } // phrases: array of 8, matching POINT_META order

const CATEGORIES = [
  {
    id:'abundancia', name:'Abundancia', color:'#8F2F0E',
    desc:'Independencia económica y creencias con el dinero.',
    karate:'Aunque estoy harta de aguantar esta situación, aunque no soy feliz y siento que estoy atrapada porque dependo económicamente de mi marido, y aunque me aterra pensar que si me voy puedo quedarme sin dinero y que a mi hija y a mi madre les falte lo necesario, me acepto completamente y acepto todo lo que estoy sintiendo ahora mismo.',
    rounds:[
      R('Harta de aguantar', ['Estoy harta de aguantar.','Estoy harta de esta situación.','No soy feliz viviendo así.','Siento que estoy atrapada.','Siento que no puedo salir.','Dependo económicamente de mi marido.','Y eso me hace sentir atrapada.','Tengo miedo de no poder mantenerme por mí misma.']),
      R('Miedo', ['Tengo miedo de quedarme sin dinero.','Tengo miedo de quedarme en la calle.','Tengo miedo de que a mi hija le falte lo necesario.','Tengo miedo de que a mi madre le falte lo necesario.','Tengo miedo de no poder protegerlas.','Todo este miedo que llevo dentro.','Todo este peso en mi pecho.','Todo este miedo a no tener una salida.']),
      R('Rabia y cansancio', ['Estoy harta de tener que aguantar.','Estoy harta de que esto siga pasando.','Estoy harta de que el problema siga creciendo.','Estoy harta de sentir que el tiempo pasa y nada cambia.','Estoy harta de sentir que tengo que soportarlo.','Toda esta rabia que tengo.','Todo este cansancio.','Todo este peso que llevo dentro.']),
      R('Impotencia', ['Siento que no puedo hacer nada.','Siento que no tengo suficiente dinero para irme.','Siento que mi libertad depende del dinero.','Y eso me desespera.','No quiero seguir dependiendo.','Quiero poder decidir por mí misma.','Quiero tener una salida.','Quiero sentir que puedo elegir.']),
    ],
    apertura:['Quizás pueda existir una salida que todavía no estoy viendo.','Quizás pueda encontrar nuevas formas de generar dinero.','Me permito descubrir nuevas posibilidades.','Me permito construir poco a poco mi independencia.','Me permito confiar en mi capacidad para salir adelante.','Me permito crear una vida diferente.','Me permito imaginarme libre.','Me permito acercarme a la vida que quiero.'],
    cierre:['Puedo decidir dónde vivir.','Puedo cuidar de mi hija.','Puedo cuidar de mi madre.','Puedo construir mi propia vida.','Puedo encontrar mi camino.','Puedo crear nuevas posibilidades.','Ya no quiero sentirme atrapada.','Me permito avanzar hacia mi libertad.'],
  },
  {
    id:'ansiedad', name:'Ansiedad', color:'#4A2442',
    desc:'Para bajar la activación cuando aprieta.',
    karate:'Aunque siento esta ansiedad que no me deja en paz, aunque siento el pecho apretado y la cabeza acelerada, me acepto completamente y acepto todo lo que estoy sintiendo ahora mismo.',
    rounds:[
      R('La ansiedad en el cuerpo', ['Siento esta ansiedad.','Siento el pecho apretado.','Siento la cabeza acelerada.','No puedo parar de pensar.','Siento que no controlo lo que siento.','Toda esta ansiedad en mi cuerpo.','Este nudo que no se va.','Toda esta tensión acumulada.']),
      R('El miedo detrás', ['Tengo miedo de que algo salga mal.','Tengo miedo de no poder con todo.','Tengo miedo de perder el control.','Siento que algo malo va a pasar.','Y eso me mantiene alerta todo el tiempo.','Todo este miedo anticipado.','Toda esta alerta constante.','Todo este cansancio de estar así.']),
      R('Quiero soltar', ['Estoy cansada de sentirme así.','Quiero poder respirar tranquila.','Quiero sentirme en calma.','Quiero confiar en que puedo con esto.','Elijo soltar un poco de este control.','Elijo darle espacio a la calma.','Elijo bajar el ritmo.','Elijo permitirme respirar.']),
    ],
    apertura:['Quizás pueda sentirme más tranquila de lo que creo.','Me permito respirar más despacio.','Me permito confiar en este momento.','Me permito soltar un poco el control.','Me permito sentirme segura ahora.','Me permito estar en calma.','Me permito bajar la guardia un momento.','Me permito sentirme en paz.'],
    cierre:['Puedo respirar despacio.','Puedo estar presente en este momento.','Puedo confiar en mí misma.','Puedo con lo que venga.','Puedo pedir ayuda si la necesito.','Puedo sentirme más tranquila.','Ya no necesito estar en alerta todo el tiempo.','Me permito sentirme en calma.'],
  },
  {
    id:'cabeza', name:'Dolores de cabeza', color:'#354A24',
    desc:'Ronda orientada al dolor de cabeza.',
    note:'Si el dolor es intenso, recurrente o va acompañado de otros síntomas, consulta con un profesional de salud.',
    karate:'Aunque tengo este dolor de cabeza, y aunque no sé exactamente de dónde viene toda esta tensión, me acepto completamente y acepto este dolor tal y como es ahora mismo.',
    rounds:[
      R('El dolor', ['Este dolor de cabeza.','Esta presión que siento.','Este dolor en las sienes.','Esta tensión detrás de los ojos.','Este peso en la cabeza.','Todo este dolor.','Toda esta presión.','Todo este malestar.']),
      R('Lo que lo alimenta', ['Toda la tensión que llevo acumulada.','Todo lo que no he soltado hoy.','Todo lo que he estado aguantando.','Todo el cansancio en mis ojos.','Toda la tensión en mi mandíbula.','Toda la tensión en mi cuello.','Toda esta carga.','Todo este peso que sostengo.']),
      R('Permitir que afloje', ['Permito que esta tensión empiece a aflojar.','Permito que mis sienes se relajen.','Permito que mis ojos descansen.','Permito que mi mandíbula se suelte.','Permito que mi cuello se relaje.','Permito que este dolor vaya bajando.','Permito que mi cuerpo se calme.','Permito que la presión se libere.']),
    ],
    apertura:['Quizás este dolor pueda seguir bajando.','Me permito sentir alivio.','Me permito relajar mi rostro.','Me permito soltar esta tensión.','Me permito descansar un momento.','Me permito sentirme más ligera.','Me permito que mi cuerpo se calme.','Me permito sentir bienestar.'],
    cierre:['Puedo relajar mi cabeza.','Puedo soltar esta tensión.','Puedo darle descanso a mis ojos.','Puedo aflojar mi mandíbula.','Puedo relajar mi cuello.','Puedo sentir alivio.','Ya no necesito sostener esta tensión.','Me permito sentirme mejor.'],
  },
  {
    id:'menstrual', name:'Dolores menstruales', color:'#742E0E',
    desc:'Acompaña el dolor y da permiso al cuerpo de soltar.',
    note:'Si el dolor es muy intenso o inhabitual, consulta con un profesional de salud.',
    karate:'Aunque tengo este dolor menstrual, y aunque mi cuerpo está pidiendo tregua, me acepto completamente y le doy permiso a mi cuerpo para sentir lo que necesite sentir.',
    rounds:[
      R('El dolor', ['Este dolor menstrual.','Este dolor en el vientre.','Esta presión abajo.','Este dolor que va y viene.','Esta molestia en la espalda baja.','Todo este dolor.','Todo este malestar.','Todo lo que mi cuerpo está sosteniendo.']),
      R('Resistencia', ['Estoy cansada de que me duela cada mes.','Estoy cansada de tener que seguir igual con este dolor.','Quisiera que mi cuerpo no tuviera que pasar por esto.','Toda la tensión de intentar aguantar.','Toda la tensión de no poder parar.','Toda esta resistencia al dolor.','Todo este cansancio.','Todo este peso.']),
      R('Permitir y soltar', ['Le doy permiso a mi cuerpo para relajarse.','Le doy permiso a mi vientre para aflojar.','Permito que este dolor vaya bajando.','Permito que mi cuerpo descanse.','Me doy permiso para ir más despacio hoy.','Me doy permiso para cuidarme.','Permito que mi cuerpo se calme.','Permito sentir alivio.']),
    ],
    apertura:['Quizás este dolor pueda seguir bajando.','Me permito sentir alivio poco a poco.','Me permito ir más despacio hoy.','Me permito pedir ayuda o descanso si lo necesito.','Me permito cuidar de mi cuerpo.','Me permito sentirme más cómoda.','Me permito relajar mi vientre.','Me permito sentir bienestar.'],
    cierre:['Puedo cuidar de mi cuerpo hoy.','Puedo ir más despacio.','Puedo relajar mi vientre.','Puedo pedir lo que necesito.','Puedo sentir alivio.','Puedo darle tregua a mi cuerpo.','Ya no necesito aguantar en silencio.','Me permito sentirme mejor.'],
  },
  {
    id:'espalda', name:'Dolores de espalda', color:'#354A24',
    desc:'Tensión y peso acumulado en la espalda.',
    note:'Si el dolor es intenso, persistente o viene de una lesión, consulta con un profesional de salud.',
    karate:'Aunque tengo esta tensión y este dolor en la espalda, y aunque siento que cargo con demasiado, me acepto completamente y acepto todo lo que mi cuerpo está sosteniendo.',
    rounds:[
      R('El dolor', ['Este dolor de espalda.','Esta tensión en los hombros.','Este peso en la zona baja.','Esta rigidez que siento.','Este dolor que no se va.','Toda esta tensión.','Todo este dolor.','Todo este peso que cargo.']),
      R('Lo que cargo', ['Todo lo que sostengo con mi espalda.','Todo lo que cargo sin darme cuenta.','Todas las responsabilidades sobre mis hombros.','Todo lo que llevo sola.','Todo este peso invisible.','Toda esta carga acumulada.','Todo este cansancio en el cuerpo.','Todo lo que necesito soltar.']),
      R('Soltar el peso', ['Permito que mi espalda se relaje.','Permito que mis hombros bajen.','Suelto parte de este peso.','No tengo que cargar con todo yo sola.','Me permito pedir ayuda.','Me permito soltar tensión.','Me permito descansar.','Permito que mi cuerpo se afloje.']),
    ],
    apertura:['Quizás pueda soltar un poco más este peso.','Me permito bajar los hombros.','Me permito pedir ayuda cuando la necesite.','Me permito descansar sin culpa.','Me permito cuidar de mi espalda.','Me permito aflojar la tensión.','Me permito sentirme más ligera.','Me permito sentir alivio.'],
    cierre:['Puedo soltar peso de mis hombros.','Puedo pedir ayuda cuando la necesito.','Puedo cuidar de mi espalda.','Puedo descansar sin culpa.','Puedo relajar mi cuerpo.','Puedo sentirme más ligera.','Ya no tengo que cargar con todo yo sola.','Me permito sentir alivio.'],
  },
  {
    id:'jornada', name:'Fin de jornada', color:'#8F2F0E',
    desc:'Soltar el cansancio al terminar de trabajar.',
    karate:'Aunque termino el día cargada de cansancio y de tensión, y aunque siento que no he podido soltar todavía, me acepto completamente y me permito empezar a soltar ahora.',
    rounds:[
      R('El cansancio', ['Todo el cansancio del día.','Toda la tensión acumulada.','Todo lo que hice hoy.','Todo lo que tuve que sostener.','Todo este agotamiento.','Todo este peso del día.','Toda esta carga.','Todo lo que todavía llevo encima.']),
      R('Lo que no he soltado', ['Todo lo que me quedó pendiente.','Todo lo que no salió como esperaba.','Todo lo que sigo pensando aunque el día terminó.','Toda la tensión que sigue en mi cuerpo.','Toda la actividad que no para en mi cabeza.','Todo esto que quiero dejar atrás.','Todo lo que necesito soltar hoy.','Todo lo que puedo dejar aquí.']),
      R('Cerrar el día', ['Elijo cerrar el día aquí.','Elijo soltar lo que ya pasó.','Elijo descansar mi mente.','Elijo descansar mi cuerpo.','Mañana seguirá lo que tenga que seguir.','Ahora me permito parar.','Me permito desconectar.','Me permito descansar.']),

function estimateMinutes(cat, seconds){
  const total = 4 + cat.rounds.reduce((s,r)=>s+r.phrases.length,0) + cat.apertura.length + cat.cierre.length;
  return Math.max(1, Math.round((total*seconds)/60));
}

function buildDiagramHTML(activeKey){
  const allPoints = [...POINT_META, KARATE_META];
  const p = allPoints.find(pt => pt.key === activeKey);
  if(!p) return `<div class="diagram-wrap"><img src="${DIAGRAM_IMG}" alt="Puntos de tapping"></div>`;
  const dot = `<div class="pt-dot active" style="left:${p.x}%;top:${p.y}%;"></div>`;
  return `<div class="diagram-wrap"><img src="${DIAGRAM_IMG}" alt="Puntos de tapping">${dot}</div>`;
}

function renderThermometer(container, value, onChange){
  container.innerHTML = '';
  const wrap = el('div',{class:'thermo-block'});
  const valueEl = el('div',{class:'thermo-value'}, String(value));
  const track = el('div',{class:'thermo-track'});
  const labels = el('div',{class:'thermo-labels'});
  for(let i=10;i>=0;i--){ labels.appendChild(el('span',{}, String(i))); }
  const fillBar = el('div',{class:'thermo-fill'});
  const thumb = el('div',{class:'thermo-thumb'});
  track.appendChild(fillBar); track.appendChild(thumb);

  function setVal(v){
    v = Math.max(0, Math.min(10, v));
    valueEl.textContent = String(v);
    const pct = (v/10)*100;
    fillBar.style.height = pct+'%';
    thumb.style.bottom = pct+'%';
    onChange(v);
  }
  let dragging = false;
  function posToVal(clientY){
    const rect = track.getBoundingClientRect();
    const pct = 1 - Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
    return Math.round(pct*10);
  }
  track.addEventListener('pointerdown',(e)=>{ dragging=true; setVal(posToVal(e.clientY)); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove',(e)=>{ if(dragging) setVal(posToVal(e.clientY)); });
  track.addEventListener('pointerup',()=>{ dragging=false; });

  wrap.appendChild(valueEl);
  const row = el('div',{class:'thermo-row'});
  row.appendChild(labels); row.appendChild(track);
  wrap.appendChild(row);
  container.appendChild(wrap);
  setVal(value);
}
const SETTINGS_KEY = 'tapping_settings_v1';
function loadHistory(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }catch(e){ return []; } }
function saveHistory(list){ localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); }
function loadSettings(){ try{ return {...{seconds:9}, ...JSON.parse(localStorage.getItem(SETTINGS_KEY))}; }catch(e){ return {seconds:9}; } }
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

/* =================== DOM helpers =================== */
const app = document.getElementById('app');
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

/* =================== Audio cues =================== */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq=520, dur=0.09, vol=0.05){
  if(!actx) return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.frequency.value = freq; o.type='sine';
  g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur + 0.02);
}
function chime(){ beep(660,0.12,0.06); setTimeout(()=>beep(880,0.15,0.05),110); }

/* =================== State =================== */
let state = { screen:'home', category:null, sudBefore:5, sudAfter:5 };
let settings = loadSettings();
let timerHandle = null; // interval id for the running player
let playerCtx = null;   // holds current sequence/index/paused/etc

function clearTimer(){ if(timerHandle){ clearInterval(timerHandle); timerHandle=null; } }

function goto(screen, patch={}){
  clearTimer();
  state = {...state, screen, ...patch};
  render();
  window.scrollTo(0,0);
}

/* =================== Build full step sequence for a category =================== */
function buildSequence(cat){
  const steps = [];
  // karate phase: 4 reps
  for(let i=0;i<4;i++){
    steps.push({phase:'karate', repIndex:i, repTotal:4, key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  }
  cat.rounds.forEach((round)=>{
    round.phrases.forEach((phrase, idx)=>{
      steps.push({phase:'round', roundTitle:round.title, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase});
    });
  });
  return steps;
}
function buildExtraSequence(phrases, phaseLabel){
  return phrases.map((phrase, idx)=>({phase:phaseLabel, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase}));
}

/* =================== Player (auto-advancing) =================== */
function startPlayer(steps, onFinish){
  ensureAudio();
  playerCtx = { steps, index:0, paused:false, secondsLeft:settings.seconds, onFinish };
  renderPlayerFrame(true);
  runTick();
}
function runTick(){
  clearTimer();
  timerHandle = setInterval(()=>{
    if(!playerCtx || playerCtx.paused) return;
    playerCtx.secondsLeft -= 0.1;
    if(playerCtx.secondsLeft <= 0){
      advancePlayer();
    } else {
      updateProgressBar();
    }
  }, 100);
}
function advancePlayer(){
  const isNewRound = playerCtx.index < playerCtx.steps.length-1 &&
    playerCtx.steps[playerCtx.index].roundTitle !== playerCtx.steps[playerCtx.index+1]?.roundTitle;
  playerCtx.index++;
  if(playerCtx.index >= playerCtx.steps.length){
    clearTimer();
    chime();
    playerCtx.onFinish();
    return;
  }
  beep(isNewRound ? 740 : 520, isNewRound?0.14:0.08, isNewRound?0.06:0.045);
  playerCtx.secondsLeft = settings.seconds;
  renderPlayerFrame(false);
}
function togglePause(){
  if(!playerCtx) return;
  playerCtx.paused = !playerCtx.paused;
  const btn = document.getElementById('pauseBtn');
  if(btn) btn.textContent = playerCtx.paused ? '▶' : '❚❚';
}
function skipPoint(){ if(playerCtx) advancePlayer(); }
function exitPlayer(){ clearTimer(); playerCtx=null; goto('home'); }

function updateProgressBar(){
  const fill = document.getElementById('progFill');
  if(!fill || !playerCtx) return;
  const pct = 100 - (playerCtx.secondsLeft/settings.seconds)*100;
  fill.style.width = Math.max(0,Math.min(100,pct))+'%';
}

function renderPlayerFrame(isFirst){
  const cat = state.category;
  const step = playerCtx.steps[playerCtx.index];
  const wrap = el('div',{class:'player'});

  const top = el('div',{class:'player-top'});
  top.appendChild(el('button',{class:'exit',onclick:exitPlayer},'×'));
  const phaseLabel = step.phase==='karate' ? 'Preparación'
    : step.phase==='round' ? step.roundTitle
    : step.phase==='apertura' ? 'Ronda de apertura'
    : 'Cierre';
  top.appendChild(el('span',{class:'phase-label'}, phaseLabel));
  top.appendChild(el('span',{style:'width:22px'}));
  wrap.appendChild(top);

  wrap.appendChild(el('div',{class:'progress-track'}, el('div',{class:'progress-fill',id:'progFill'})));

  const mid = el('div',{class:'player-mid'});
  if(step.phase==='karate'){
    mid.appendChild(el('div',{class:'rep-count'}, `Repetición ${step.repIndex+1} de ${step.repTotal}`));
  }
  const diagramHolder = el('div',{html: buildDiagramHTML(step.key)});
  mid.appendChild(diagramHolder);
  mid.appendChild(el('div',{class:'point-name'}, step.name));
  mid.appendChild(el('div',{class:'point-where'}, step.where));
  mid.appendChild(el('div',{class:'point-phrase'}, `"${step.phrase}"`));
  wrap.appendChild(mid);

  const controls = el('div',{class:'player-controls'});
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:togglePause,id:'pauseBtn'}, '❚❚'));
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:skipPoint}, '⏭'));
  wrap.appendChild(controls);

  app.replaceChildren(wrap);
}

/* =================== Static screens =================== */
function renderHome(){
  const header = el('div',{class:'home-header'},[
    el('div',{class:'eyebrow'},'Tu práctica diaria'),
    el('h1',{},'Tapping'),
    el('p',{},'Elige qué te está pidiendo atención ahora mismo. La app avanza sola por los puntos — tú solo golpetea.'),
  ]);

  const intro = el('div',{class:'intro-card',onclick:()=>goto('intro')},[
    el('div',{class:'dot'},'?'),
    el('div',{},[el('h3',{},'Primeros pasos'),el('span',{},'Cómo funciona la app, en 1 minuto')]),
  ]);

  const cards = CATEGORIES.map(cat=>{
    const mins = estimateMinutes(cat, settings.seconds);
    const overlay = el('div',{class:'cat-overlay'});
    const text = el('div',{class:'cat-text'},[ el('h3',{},cat.name), el('span',{},`${mins} min · ${cat.desc}`) ]);
    const card = el('div',{class:'cat-card', style:`background:${cat.photo?`url('${cat.photo}') center/cover`:`linear-gradient(135deg, ${cat.color}, ${cat.color}CC)`}`, onclick:()=>goto('sud-before',{category:cat, sudBefore:5})},[overlay, text]);
    return card;
  });

  const hist = loadHistory();
  const histLink = el('div',{class:'hist-link',onclick:()=>goto('history')},[
    el('span',{},`Historial · ${hist.length} sesión${hist.length===1?'':'es'}`),
    el('span',{},'›')
  ]);

  app.replaceChildren(header, intro, el('div',{class:'grid'}, cards), secRowBuilder(), histLink,
    el('div',{class:'footer-note'},'Esta app es un apoyo personal de autoayuda, no sustituye la atención médica o psicológica profesional.'));
}

function secRowBuilder(){
  const secRow = el('div',{class:'settings-row'});
  secRow.appendChild(el('span',{}, 'Segundos por punto'));
  const seg = el('div',{class:'seg'});
  [6,9,12].forEach(sec=>{
    const b = el('button',{class: settings.seconds===sec?'active':'', onclick:()=>{ settings.seconds=sec; saveSettings(settings); renderHome(); }}, sec+'s');
    seg.appendChild(b);
  });
  secRow.appendChild(seg);
  return secRow;
}

function renderIntro(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('h2',{},'Cómo funciona'));
  const steps = [
    'Elige la categoría que necesites ahora mismo.',
    'Valora la intensidad del 0 al 10 con el termómetro.',
    'La app avanza sola por los 9 puntos, con un pitido en cada cambio — tú solo golpetea.',
    'Al terminar, vuelves a valorar cómo te sientes y se guarda en tu historial.',
  ];
  steps.forEach((s,i)=>{
    wrap.appendChild(el('p',{class:'stage-copy'}, `${i+1}. ${s}`));
  });
  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('home')},'Entendido'));
  app.replaceChildren(wrap);
}

function topBar(onBack){
  return el('div',{class:'topbar'},[ el('button',{class:'back-btn',onclick:onBack},'‹ Atrás'), el('span',{}) ]);
}

function renderSudBefore(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'Antes de empezar'));
  wrap.appendChild(el('p',{class:'stage-copy'},'¿Cuánto sientes esto ahora mismo?'));

  const thermoContainer = el('div',{style:'margin-bottom:20px;'});
  wrap.appendChild(thermoContainer);
  renderThermometer(thermoContainer, state.sudBefore, (v)=>{ state.sudBefore = v; });

  if(cat.note) wrap.appendChild(el('p',{class:'stage-copy',style:'font-size:13.5px;'}, cat.note));

  wrap.appendChild(el('div',{class:'phrase-box'}, el('p',{}, cat.karate)));
  wrap.appendChild(el('p',{class:'stage-copy',style:'margin-top:-10px;'},'Esta es la frase de preparación. Se repetirá 4 veces golpeteando el canto de la mano.'));

  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>{
    ensureAudio();
    goto('player-main');
  }},'Empezar sesión'));
  app.replaceChildren(wrap);
}

function renderPlayerMain(){
  const cat = state.category;
  const seq = buildSequence(cat);
  startPlayer(seq, ()=> goto('breath'));
}

function renderBreath(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'Respira'));
  wrap.appendChild(el('p',{class:'stage-copy'},'Haz 3 respiraciones lentas. Piensa otra vez en lo mismo y valora cómo lo sientes ahora.'));
  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('sud-after')},'Estoy lista'));
  app.replaceChildren(wrap);
}

function renderSudAfter(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'¿Cuánto sientes esto ahora?'));

  const thermoContainer = el('div',{style:'margin-bottom:20px;'});

  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('p',{class:'stage-copy',style:'font-size:13.5px;'},'¿Ha bajado la intensidad?'));

function renderPlayerApertura(){
  const cat = state.category;
  const seq = buildExtraSequence(cat.apertura, 'apertura');
  startPlayer(seq, ()=> goto('player-cierre'));
}
function renderPlayerCierre(){
  const cat = state.category;
  const seq = buildExtraSequence(cat.cierre, 'cierre');
  startPlayer(seq, ()=>{
    const hist = loadHistory();
    hist.unshift({date:new Date().toISOString(), category:cat.name, before:state.sudBefore, after:state.sudAfter});
    saveHistory(hist.slice(0,200));
    goto('done');
  });
}

function renderDone(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(el('div',{class:'spacer'}));
  const summary = el('div',{class:'end-summary'},[
    el('div',{class:'num'},[el('strong',{},String(state.sudBefore)), el('span',{},'antes')]),
    el('div',{class:'arrow'},'→'),
    el('div',{class:'num'},[el('strong',{},String(state.sudAfter)), el('span',{},'después')]),
  ]);
  wrap.appendChild(el('h2',{style:'text-align:center;margin-bottom:8px;'},'Sesión guardada'));
  wrap.appendChild(summary);
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('home')},'Volver al inicio'));
  wrap.appendChild(el('div',{class:'spacer'}));
  app.replaceChildren(wrap);
}

function renderHistory(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('h2',{style:'margin-bottom:16px;'},'Historial'));
  const hist = loadHistory();
  if(hist.length===0){
    wrap.appendChild(el('div',{class:'empty-hist'},'Aún no has guardado ninguna sesión.'));
  } else {
    hist.forEach(h=>{
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      wrap.appendChild(el('div',{class:'hist-item'},[
        el('div',{class:'l'},[el('strong',{},h.category), el('span',{},dateStr)]),
        el('div',{class:'r'},`${h.before} → ${h.after}`)
      ]));
    });
  }
  app.replaceChildren(wrap);
}

function render(){
  switch(state.screen){
    case 'home': return renderHome();
    case 'intro': return renderIntro();
    case 'sud-before': return renderSudBefore();
    case 'player-main': return renderPlayerMain();
    case 'breath': return renderBreath();
    case 'sud-after': return renderSudAfter();
    case 'player-apertura': return renderPlayerApertura();
    case 'player-cierre': return renderPlayerCierre();
    case 'done': return renderDone();
    case 'history': return renderHistory();
  }
}

render();
