<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFFFFF">
<title>Centro · Tapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --stone:#FFFFFF; --stone-deep:#EDE7DC; --ink:#141210; --ink-soft:#4A4438;
    --sienna:#B23D14; --sienna-deep:#8F2F0E; --sage:#3E5A2E; --sage-deep:#2F4522;
    --plum:#5A2E52; --card:#FAF6EE; --line:rgba(20,18,16,0.28);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:#FFFFFF;color-scheme:light;}
  html,body{margin:0;padding:0;}
  body{background:var(--stone);color:var(--ink);font-family:'Source Sans 3',Arial,sans-serif;font-size:18px;min-height:100vh;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Source Sans 3',Arial,sans-serif;font-weight:700;margin:0;letter-spacing:0;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--stone);}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 6px;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-size:15px;font-family:'Source Sans 3',sans-serif;padding:6px 0;cursor:pointer;}
  .back-btn:active{opacity:0.6;}

  .home-header{padding:8px 24px 4px;}
  .home-header .eyebrow{color:var(--sienna-deep);font-size:16px;margin-bottom:6px;font-weight:600;}
  .home-header h1{font-size:36px;}
  .home-header p{color:var(--ink-soft);font-size:18px;line-height:1.55;margin-top:10px;max-width:34ch;}

  .grid{padding:16px 20px 8px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .cat-card{position:relative;border-radius:10px;overflow:hidden;height:150px;cursor:pointer;display:flex;align-items:flex-end;border:1px solid var(--line);}
  .cat-card:active{transform:scale(0.98);}
  .cat-card .cat-overlay{position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,0.68) 0%, rgba(0,0,0,0.2) 55%, rgba(0,0,0,0.05) 100%);}
  .cat-card .cat-text{position:relative;padding:12px 12px;color:#fff;width:100%;}
  .cat-card .cat-text h3{font-size:16px;color:#fff;margin-bottom:2px;line-height:1.15;}
  .cat-card .cat-text span{font-size:12.5px;color:rgba(255,255,255,0.88);}

  .hero-wrap{position:relative;width:100%;height:260px;overflow:hidden;}
  .hero-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .hero-wrap .hero-fallback{width:100%;height:100%;}
  .hero-back{position:absolute;top:16px;left:16px;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,0.9);border:none;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--ink);cursor:pointer;}
  .detail-body{padding:22px 24px 30px;}
  .detail-body h1{font-size:26px;margin-bottom:8px;}
  .detail-meta{font-size:14.5px;color:var(--ink-soft);margin-bottom:18px;}
  .detail-desc{font-size:16px;line-height:1.6;color:var(--ink);margin-bottom:26px;}
  .action-row{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px;}
  .action-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 0;cursor:pointer;border-right:1px solid var(--line);background:none;border-top:none;border-bottom:none;font-family:'Source Sans 3',Arial,sans-serif;}
  .action-item:last-child{border-right:none;}
  .action-item .icon{font-size:19px;}
  .action-item .label{font-size:12px;color:var(--ink-soft);letter-spacing:0.02em;text-transform:uppercase;}
  .action-item.active .icon, .action-item.active .label{color:var(--sienna);}
  .action-toast{text-align:center;font-size:14px;font-weight:600;color:#fff;background:var(--sienna);border-radius:6px;padding:10px;margin:-6px 0 20px;min-height:16px;}
  .action-toast:empty{background:none;padding:0;margin:-14px 0 20px;}

  .intro-card{margin:0 20px 4px;padding:18px;border:2px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;gap:14px;cursor:pointer;}
  .intro-card:active{background:var(--stone-deep);}
  .intro-card .dot{width:40px;height:40px;border-radius:50%;background:var(--sienna);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none;}
  .intro-card h3{font-size:17px;margin-bottom:2px;}
  .intro-card span{font-size:14px;color:var(--ink-soft);}

  .quick-block{margin:14px 20px 4px;}
  .quick-title{font-size:15px;font-weight:700;margin-bottom:10px;}
  .quick-row{display:flex;flex-wrap:wrap;gap:8px;}
  .quick-pill{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:9px 14px;font-size:14px;color:var(--ink);cursor:pointer;font-family:'Source Sans 3',Arial,sans-serif;}
  .quick-pill:active{background:var(--stone-deep);}

  .thermo-block{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .thermo-value{font-size:44px;font-weight:700;}
  .thermo-row{display:flex;align-items:stretch;gap:16px;height:260px;}
  .thermo-labels{display:flex;flex-direction:column;justify-content:space-between;font-size:14px;color:var(--ink-soft);font-weight:600;padding:2px 0;}
  .thermo-track{position:relative;width:14px;background:var(--stone-deep);border:2px solid var(--line);border-radius:8px;touch-action:none;}
  .thermo-fill{position:absolute;bottom:0;left:0;right:0;background:var(--sienna);border-radius:0 0 6px 6px;height:0%;}
  .thermo-thumb{position:absolute;left:50%;bottom:0%;width:30px;height:30px;background:#fff;border:3px solid var(--sienna);border-radius:50%;transform:translate(-50%,50%);}

  .diagram-wrap{position:relative;width:190px;margin:0 auto 8px;border-radius:10px;overflow:hidden;}
  .diagram-wrap img{width:100%;display:block;}

  .thermo-h-block{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:260px;margin:14px auto 0;}
  .thermo-h-native{width:100%;accent-color:var(--sienna);height:6px;}
  .thermo-h-labels{display:flex;justify-content:space-between;width:100%;font-size:13px;color:var(--ink-soft);font-weight:600;}
  .pt-dot{position:absolute;width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,0.55);border:2px solid rgba(255,255,255,0.85);transform:translate(-50%,-50%);}
  .pt-dot.active{width:16px;height:16px;background:var(--sienna);border:2px solid #fff;animation:ptpulse 1.3s ease-out infinite;}
  @keyframes ptpulse{
    0%{box-shadow:0 0 0 0 rgba(178,61,20,0.55);}
    70%{box-shadow:0 0 0 16px rgba(178,61,20,0);}
    100%{box-shadow:0 0 0 0 rgba(178,61,20,0);}
  }

  .settings-row{margin:6px 20px 4px;padding:16px;border:2px solid var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:16px;color:var(--ink);}
  .seg{display:flex;border:2px solid var(--line);border-radius:20px;overflow:hidden;}
  .seg button{border:none;background:transparent;padding:8px 14px;font-size:16px;color:var(--ink);cursor:pointer;}
  .seg button.active{background:var(--sienna);color:#fff;}

  .hist-link{margin:6px 20px 0;padding:16px 18px;border:2px dashed var(--line);border-radius:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;color:var(--ink);font-size:16.5px;}
  .hist-link:active{opacity:0.6;}
  .footer-note{padding:16px 26px 34px;font-size:14.5px;color:var(--ink-soft);line-height:1.6;}

  .session-wrap{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .cat-tag{font-size:15px;color:var(--sienna-deep);margin-bottom:6px;font-weight:600;}
  .session-wrap h2{font-size:27px;margin-bottom:14px;}
  .stage-copy{color:var(--ink);font-size:17.5px;line-height:1.6;margin-bottom:22px;}

  .sud-row{display:flex;align-items:center;gap:14px;margin:8px 0 26px;}
  .sud-row input[type=range]{flex:1;accent-color:var(--sienna);height:8px;}
  .sud-value{font-size:34px;font-weight:700;min-width:40px;text-align:center;}

  .phrase-box{background:var(--card);border:2px solid var(--line);border-radius:6px;padding:20px;margin-bottom:20px;}
  .phrase-box p{font-size:20px;font-weight:500;line-height:1.55;margin:0;}

  /* --- Player screen (hands-free) --- */
  .player{flex:1;display:flex;flex-direction:column;padding:0 24px 30px;}
  .player-top{display:flex;justify-content:space-between;align-items:center;padding:20px 0 4px;}
  .player-top .exit{background:none;border:none;color:var(--ink-soft);font-size:22px;cursor:pointer;line-height:1;}
  .player-top .phase-label{font-size:15px;color:var(--sienna-deep);font-weight:600;}

  .progress-track{height:6px;background:var(--stone-deep);border:1px solid var(--line);border-radius:3px;overflow:hidden;margin:10px 0 30px;}
  .progress-fill{height:100%;background:var(--sienna);width:0%;transition:none;}

  .player-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;}
  .round-title{font-size:22px;font-weight:700;color:var(--ink);}
  .rep-count{font-size:15px;color:var(--ink);letter-spacing:0.03em;font-weight:600;}
  .point-name{font-size:34px;font-weight:700;margin-top:6px;color:var(--ink);}
  .point-where{font-size:17px;color:var(--ink-soft);margin-top:4px;}
  .point-phrase{font-size:23px;color:var(--sienna-deep);font-weight:600;line-height:1.5;margin-top:22px;max-width:26ch;}

  .timer-ring{width:64px;height:64px;border-radius:50%;border:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:6px;}
  .timer-ring span{font-size:17px;font-weight:700;}

  .player-controls{display:flex;justify-content:center;gap:18px;padding-top:22px;}
  .ctrl-btn{background:var(--card);border:2px solid var(--line);border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--ink);cursor:pointer;}
  .ctrl-btn:active{background:var(--stone-deep);}

  .btn{border:none;border-radius:6px;padding:18px 20px;font-size:18px;font-family:'Source Sans 3',sans-serif;font-weight:700;cursor:pointer;width:100%;}
  .btn-primary{background:var(--sienna);color:#fff;}
  .btn-primary:active{background:var(--sienna-deep);}
  .btn-ghost{background:transparent;color:var(--ink);border:2px solid var(--line);margin-top:10px;}
  .btn-ghost:active{background:var(--stone-deep);}
  .spacer{flex:1;}

  .choice-row{display:flex;gap:10px;margin-top:6px;}
  .choice-row .btn{flex:1;}

  .end-summary{display:flex;justify-content:space-around;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:6px;padding:26px 12px;margin-bottom:20px;}
  .end-summary .num{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .end-summary .num strong{font-size:40px;font-weight:700;}
  .end-summary .num span{font-size:14px;color:var(--ink);}
  .end-summary .arrow{color:var(--ink);font-size:22px;}

  .hist-item{border-bottom:1px solid var(--line);padding:16px 2px;display:flex;justify-content:space-between;align-items:center;}
  .hist-item .l{display:flex;flex-direction:column;gap:2px;}
  .hist-item .l strong{font-size:17px;}
  .hist-item .l span{font-size:14px;color:var(--ink-soft);}
  .hist-item .r{font-size:17px;font-weight:700;color:var(--sienna-deep);}
  .empty-hist{color:var(--ink-soft);font-size:16px;padding:30px 4px;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =================== Data =================== */
// Order matches the 8 tapping points used in every round (after the karate point).
const POINT_META = [
  {key:'ceja', name:'Ceja', where:'inicio de la ceja, junto al puente de la nariz', x:53, y:28},
  {key:'ladoOjo', name:'Lado del ojo', where:'hueso de la sien, junto al rabillo del ojo', x:59, y:31},
  {key:'debajoOjo', name:'Debajo del ojo', where:'sobre el hueso, bajo la pupila', x:55, y:33},
  {key:'debajoNariz', name:'Debajo de la nariz', where:'entre la nariz y el labio superior', x:49, y:35},
  {key:'barbilla', name:'Barbilla', where:'en el pliegue, entre el labio y la barbilla', x:49, y:39.5},
  {key:'clavicula', name:'Clavícula', where:'debajo de la unión de las clavículas', x:49, y:49.5},
  {key:'brazo', name:'Debajo del brazo', where:'unos 10 cm bajo la axila', x:76, y:62},
  {key:'coronilla', name:'Coronilla', where:'centro superior de la cabeza', x:49, y:18.5},
];
const KARATE_META = {key:'karate', name:'Canto de la mano', where:'lado exterior de la mano, bajo el meñique', x:49, y:70};
const DIAGRAM_IMG = 'mujer-tapping.jpg';

function R(title, phrases, transition){ return {title, phrases, transition}; } // phrases: array of 8, matching POINT_META order; transition: optional line spoken before the round starts, with no point attached

const PRIMERA_SESION = {
  id:'primera-sesion', name:'Tu primera sesión', color:'#8F2F0E',
  desc:'Una práctica corta para empezar, sin experiencia previa.',
  karate:'Aunque no sé si estoy haciendo esto bien, y aunque es la primera vez que pruebo el tapping, me acepto completamente y me permito aprender a mi ritmo.',
  rounds:[
    R('Primeros pasos', ['Estoy probando algo nuevo.','No necesito hacerlo perfecto.','Solo estoy siguiendo el ritmo de la app.','Me permito aprender a mi manera.','Cada vez que toco un punto, me doy un momento de calma.','No hace falta que sienta nada especial todavía.','Solo estoy probando cómo se siente esto.','Me permito estar abierta a lo que sea que esto traiga.']),
  ],
  apertura:[], cierre:[],
};

const CATEGORIES = [
  {
    id:'resistencias', name:'Liberar resistencias', color:'#354A24', photo:'desbordada.jpg',
    audio:{file:'LIBERAR_RESISTENCIAS.mp3', hasIntro:true, hasOutro:true, timestamps:[0,31.0141,62.8974,68.1661,73.6587,78.6494,82.8272,87.533,92.9078,98.4016,104.482,109.287,117.534,122.711,126.601,131.833,137.021,141.771,148.009,154.485,159.953,178.318,182.038,186.752,190.955,194.322,197.683,200.984,206.069,210.333,213.774,216.627,220.011,224.382,227.927,231.222,235.566,239.195]},
    intro:'A veces hay una parte nuestra que se resiste, casi sin darnos cuenta, a recibir lo bueno que queremos. Esta sesión es un espacio para soltar esa resistencia interna y abrirte a la abundancia con más calma.',
    desc:'Para soltar bloqueos internos y abrirte a la abundancia.',
    introScript:'Vamos a empezar cerrando los ojos y vamos a hacer unas respiraciones profundas, tranquilas. Este es un momento para ti, solo para ti. Vamos a relajar la mente consciente, el exceso de pensamientos. Vamos a relajar también esa parte crítica, analítica, que juzga, que compara. Vamos simplemente a relajarnos y a disfrutar de esta experiencia para liberar cualquier posible resistencia que te esté impidiendo manifestar la abundancia que deseas. Comenzamos.',
    karate:'Empezamos haciendo tapping en el punto karate. Aunque puede ser que tengas alguna resistencia interna, tú eliges aceptarte y amarte completa y profundamente. Aunque puede ser que tengas alguna resistencia interna de la que quizá ni siquiera eres consciente, tú eliges liberar cualquier bloqueo y eliges abrirte a la abundancia. Aunque puede ser que tengas algún miedo, alguna preocupación, alguna necesidad de controlar que te está impidiendo tener ese estado de relajación y de apertura necesarios para atraer la abundancia, tú eliges liberarte.',
    outroScript:'Y tu único trabajo aquí es hacerte estos ejercicios y permitir esta elevación de tu vibración para sentirte mejor y para atraer más y más abundancia cada día. Muy bien, ahora dejamos de hacer tapping. No importa en qué punto te hayas quedado, igual has hecho tres rondas, cuatro, lo que sea, no importa. Si quieres puedes terminar en el punto de la cabeza, como tú prefieras. Entonces, dejamos de hacerlo. Si estabas con los ojos abiertos, ahora sería el momento de cerrarlos y vamos a respirar. Y vamos simplemente a observar, a permitir esta liberación que va a seguir su curso durante las próximas horas, durante los próximos días. Cuanto más lo hacemos, más nos vamos limpiando por dentro y más nos vamos conectando con el campo de la abundancia.',
    rounds:[
      R('Reconocer las resistencias',
        ['Empezamos en la base de la ceja, estas posibles resistencias.','Al lado del ojo, estas posibles resistencias internas.','Debajo del ojo, esta parte de ti que duda.','Debajo de la nariz, esta parte de ti que quizá se queja.','Barbilla, esta parte de ti que critica o juzga a otras personas.','Clavícula, esta parte de ti que tiene esos pensamientos negativos.','Debajo del brazo, esta parte de ti que te hace estar a veces con una vibración baja.','Punto de la cabeza, estas posibles resistencias.'],
        'Muy bien, ahora empezamos a hacer el tapping en todos los puntos.'),
      R('Liberar',
        ['En la base de la ceja, eliges soltar todo esto de tu interior.','Al lado del ojo, eliges liberarlo.','Debajo del ojo, quizá esto te venga de experiencias pasadas.','Debajo de la nariz, quizá incluso te venga de otras personas.','Barbilla, o quizá de tu propia interpretación de la realidad.','Clavícula, pero en cualquier caso, eliges liberar cualquier resistencia interna.','Debajo del brazo, eliges ser libre para poder conectarte con la abundancia que te rodea.','Punto de la cabeza, eliges simplemente disfrutar de este proceso.'],
        'Muy bien, ahora pasamos a la segunda ronda. Aquí vamos a empezar a liberar, a soltar todo esto.'),
      R('Soltar bloqueos profundos',
        ['Eliges soltar bloqueos profundos.','Eliges dejar de analizar, de juzgar, de comparar.','Todo eso son simplemente procesos mentales.','Todo eso viene de la distracción.','Quizá queremos sentirnos mejor.','Quizá queremos aliviar un miedo.','Es mucho más fácil darnos permiso para soltar ese miedo interno.','Nos damos permiso para soltar ese miedo interno.'],
        'Pasamos a la tercera ronda. Ahora ya no decimos el nombre de los puntos, sino que cambiamos más o menos una frase en cada punto, pero puedes ir a tu propio ritmo. Simplemente disfrútalo, no hay reglas. Venga, empezamos en la base de la ceja.'),
    ],
    apertura:[],
    cierre:['Vamos notando esta liberación.','El cuerpo se relaja.','Ya no tienes tanta preocupación.','Ya no te fijas tanto en lo que hacen otras personas.','Estás en un estado más positivo.','Puedes disfrutar más de la vida.','Empiezas a ver posibilidades que antes no veías.','Las cosas empiezan a fluir mejor.'],
  },
  {
    id:'abundancia', name:'Abundancia', color:'#8F2F0E', photo:'abundancia.jpg',
    intro:'El dinero puede convertirse en una fuente constante de miedo sin que nos demos cuenta. Esta sesión te acompaña a soltar esa tensión, punto a punto, hasta que la idea de la abundancia deje de sentirse como una batalla.',
    desc:'Miedo y creencias alrededor del dinero.',
    karate:'Aunque siento este miedo a no tener suficiente, aunque a veces me cuesta sentirme segura con el dinero, me acepto completamente y acepto todo lo que estoy sintiendo ahora mismo.',
    rounds:[
      R('Reconocer', ['Siento este miedo a no tener suficiente.','Siento esta inseguridad con el dinero.','A veces siento que tengo que luchar por todo.','Reconozco esta preocupación económica.','Reconozco que esto me pesa.','Todo este miedo al futuro económico.','Toda esta inseguridad que cargo.','Reconozco cómo me siento con el dinero, ahora mismo.']),
      R('Profundizar', ['Este miedo a que no me alcance.','Este miedo a perder lo que tengo.','Esta sensación de no tener el control.','Esta creencia de que el dinero es difícil de conseguir.','Esta dificultad para sentirme segura.','Esta dificultad para recibir.','Esta culpa que a veces siento con el dinero.','Todo este peso que llevo con este tema.']),
      R('Permitir', ['Me permito sentir este miedo sin juzgarme.','Me permito reconocer esta inseguridad.','Me permito soltar la exigencia de tenerlo todo resuelto.','Me permito aceptar cómo me siento hoy con esto.','Me permito bajar la lucha, aunque sea un poco.','Me permito recibir, aunque me cueste.','Me permito soltar parte de esta carga.','Me permito estar en paz con este proceso.']),
      R('Regular', ['Elijo sentirme más en calma con este tema.','Elijo respirar antes de reaccionar al miedo.','Elijo sentirme más segura, paso a paso.','Elijo un pensamiento más tranquilo sobre el dinero.','Elijo estar presente, no en el miedo futuro.','Elijo confiar en mi capacidad de resolver.','Elijo soltar la urgencia.','Elijo sentir más calma con este tema, hoy.']),
      R('Nueva dirección', ['Quizás pueda ir construyendo más seguridad con el tiempo.','Quizás existan opciones que todavía no veo.','Puedo aprender a relacionarme distinto con el dinero.','Puedo dar un paso pequeño hacia mi estabilidad.','Puedo abrirme, poco a poco, a recibir.','Puedo soltar la creencia de que todo cuesta luchar.','Puedo confiar en que voy construyendo algo mejor.','Me abro a una relación más tranquila con el dinero.']),
    ],
    apertura:['Me permito ir sintiendo más seguridad económica.','Me permito ver nuevas posibilidades.','Me permito soltar la creencia de la escasez.','Me permito aprender formas nuevas de manejar el dinero.','Me permito pedir ayuda o información cuando la necesito.','Me permito construir esto paso a paso.','Me permito sentirme más tranquila con mis finanzas.','Me permito confiar en mi propio proceso.'],
    cierre:['Puedo relacionarme de forma más tranquila con el dinero.','Puedo tomar decisiones económicas con más calma.','Puedo aprender y mejorar con el tiempo.','Puedo sentirme más segura, poco a poco.','Puedo soltar la exigencia de tenerlo todo resuelto ya.','Puedo confiar en mi capacidad de salir adelante.','Ya no tengo que cargar esto sola.','Elijo avanzar hacia más estabilidad y calma.'],
  },

function estimateMinutes(cat, seconds){
  const total = 4 + cat.rounds.reduce((s,r)=>s+r.phrases.length,0) + cat.apertura.length + cat.cierre.length;
  return Math.max(1, Math.round((total*seconds)/60));
}

function buildDiagramHTML(activeKey){
  const allPoints = [...POINT_META, KARATE_META];

  const dot = `<div class="pt-dot active" style="left:${p.x}%;top:${p.y}%;"></div>`;
  return `<div class="diagram-wrap"><img src="${DIAGRAM_IMG}" alt="Puntos de tapping">${dot}</div>`;
}

function renderThermometer(container, value, onChange){
  container.innerHTML = '';
  const wrap = el('div',{class:'thermo-block'});
  const valueEl = el('div',{class:'thermo-value'}, String(value));
  const track = el('div',{class:'thermo-track'});
  const labels = el('div',{class:'thermo-labels'});
  for(let i=10;i>=0;i--){ labels.appendChild(el('span',{}, String(i))); }
  const fillBar = el('div',{class:'thermo-fill'});
  const thumb = el('div',{class:'thermo-thumb'});
  track.appendChild(fillBar); track.appendChild(thumb);

  function setVal(v){
    v = Math.max(0, Math.min(10, v));
    valueEl.textContent = String(v);
    const pct = (v/10)*100;
    fillBar.style.height = pct+'%';
    thumb.style.bottom = pct+'%';
    onChange(v);
  }
  let dragging = false;
  function posToVal(clientY){
    const rect = track.getBoundingClientRect();
    const pct = 1 - Math.max(0,Math.min(1,(clientY-rect.top)/rect.height));
    return Math.round(pct*10);
  }
  track.addEventListener('pointerdown',(e)=>{ dragging=true; setVal(posToVal(e.clientY)); track.setPointerCapture(e.pointerId); });
  track.addEventListener('pointermove',(e)=>{ if(dragging) setVal(posToVal(e.clientY)); });
  track.addEventListener('pointerup',()=>{ dragging=false; });

  wrap.appendChild(valueEl);
  const row = el('div',{class:'thermo-row'});
  row.appendChild(labels); row.appendChild(track);
  wrap.appendChild(row);
  container.appendChild(wrap);
  setVal(value);
}

}

/* =================== DOM helpers =================== */
const app = document.getElementById('app');
function el(tag, attrs={}, children=[]){
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k,v])=>{
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k,v);
  });
  (Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null) return;
    e.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return e;
}

/* =================== Audio cues =================== */
let actx = null;
function ensureAudio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } }
function beep(freq=520, dur=0.09, vol=0.05){
  if(!actx) return;
  const o = actx.createOscillator(); const g = actx.createGain();
  o.frequency.value = freq; o.type='sine';
  g.gain.value = vol;
  o.connect(g); g.connect(actx.destination);
  o.start();
  g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
  o.stop(actx.currentTime + dur + 0.02);
}
function chime(){ beep(660,0.12,0.06); setTimeout(()=>beep(880,0.15,0.05),110); }

/* =================== Build full step sequence for a category =================== */
function buildSequence(cat){
  if(cat.segments){ return buildFreeformSteps(cat); }
  const steps = [];
  // karate phase: 4 reps
  for(let i=0;i<4;i++){
    steps.push({phase:'karate', repIndex:i, repTotal:4, key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  }
  cat.rounds.forEach((round)=>{
    if(round.transition){
      steps.push({phase:'transition', key:null, name:round.title, where:'', phrase:round.transition});
    }
    round.phrases.forEach((phrase, idx)=>{
      steps.push({phase:'round', roundTitle:round.title, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase});
    });
  });
  if(cat.apertura && cat.apertura.length){
    steps.push(...buildExtraSequence(cat.apertura, 'apertura'));
  }
  if(cat.cierre && cat.cierre.length){
    steps.push(...buildExtraSequence(cat.cierre, 'cierre'));
  }
  return steps;
}
function buildExtraSequence(phrases, phaseLabel){
  return phrases.map((phrase, idx)=>({phase:phaseLabel, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase}));
}

function buildQuickSequence(cat){
  const steps = [];
  for(let i=0;i<2;i++){
    steps.push({phase:'karate', repIndex:i, repTotal:2, key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  }
  const round = cat.rounds[0];
  round.phrases.forEach((phrase, idx)=>{
    steps.push({phase:'round', roundTitle:round.title, pointIndex:idx, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase});
  });
  return steps;
}

function buildFreeformSteps(cat){
  return cat.segments.map(seg => ({phase:'freeform', key:null, name:seg.title, where:'', phrase:seg.text}));
}

function buildAudioSteps(cat){
  if(cat.segments){ return buildFreeformSteps(cat); }
  const steps = [];
  if(cat.audio && cat.audio.hasIntro && cat.introScript){
    steps.push({phase:'intro', key:'intro', name:'Introducción', where:'', phrase:cat.introScript});
  }
  steps.push({phase:'karate', key:KARATE_META.key, name:KARATE_META.name, where:KARATE_META.where, phrase:cat.karate});
  cat.rounds.forEach((round)=>{
    if(round.transition){
      steps.push({phase:'transition', key:null, name:round.title, where:'', phrase:round.transition});
    }
    round.phrases.forEach((phrase, idx)=>{
      steps.push({phase:'round', roundTitle:round.title, key:POINT_META[idx].key, name:POINT_META[idx].name, where:POINT_META[idx].where, phrase});
    });
  });
  steps.push(...buildExtraSequence(cat.apertura,'apertura'));
  steps.push(...buildExtraSequence(cat.cierre,'cierre'));
  if(cat.audio && cat.audio.hasOutro && cat.outroScript){
    steps.push({phase:'outro', key:'outro', name:'Cierre de la sesión', where:'', phrase:cat.outroScript});
  }
  return steps;
}

function startAudioSlice(cat, startIdx, endIdxExclusive, onFinish){
  const allSteps = buildAudioSteps(cat);
  const allTs = cat.audio.timestamps;
  const steps = allSteps.slice(startIdx, endIdxExclusive);
  const timestamps = allTs.slice(startIdx, endIdxExclusive);
  const sliceEndTime = allTs[endIdxExclusive] !== undefined ? allTs[endIdxExclusive] : null;
  clearTimer();
  const audioEl = new Audio(cat.audio.file);
  playerCtx = { mode:'audio', steps, timestamps, index:0, paused:false, audioEl, onFinish, sliceEndTime };
  audioEl.currentTime = timestamps[0];
  renderPlayerFrame(true);
  audioEl.ontimeupdate = ()=>{
    if(!playerCtx || playerCtx.audioEl!==audioEl) return;
    const t = audioEl.currentTime;
    if(playerCtx.sliceEndTime!==null && t>=playerCtx.sliceEndTime){
      audioEl.ontimeupdate = null;
      audioEl.pause();
      playerCtx.onFinish();
      return;
    }
    let ni = playerCtx.index;
    while(ni+1<playerCtx.timestamps.length && t>=playerCtx.timestamps[ni+1]) ni++;
    if(ni!==playerCtx.index){ playerCtx.index=ni; renderPlayerFrame(false); }
    updateAudioProgressBar();
  };
  audioEl.onended = ()=>{ if(playerCtx && playerCtx.audioEl===audioEl) playerCtx.onFinish(); };
  audioEl.play();
}

function updateAudioProgressBar(){
  const fill = document.getElementById('progFill');
  if(!fill || !playerCtx || playerCtx.mode!=='audio') return;
  const cur = playerCtx.timestamps[playerCtx.index];
  const next = playerCtx.index+1 < playerCtx.timestamps.length ? playerCtx.timestamps[playerCtx.index+1] : playerCtx.sliceEndTime;
  const t = playerCtx.audioEl.currentTime;
  if(next==null || next<=cur){ fill.style.width='0%'; return; }
  const pct = ((t-cur)/(next-cur))*100;
  fill.style.width = Math.max(0,Math.min(100,pct))+'%';
}


function startPlayer(steps, onFinish){
  ensureAudio();
  playerCtx = { steps, index:0, paused:false, secondsLeft:settings.seconds, onFinish };
  renderPlayerFrame(true);
  runTick();
}
function runTick(){
  clearTimer();
  timerHandle = setInterval(()=>{
    if(!playerCtx || playerCtx.paused) return;
    playerCtx.secondsLeft -= 0.1;
    if(playerCtx.secondsLeft <= 0){
      advancePlayer();
    } else {
      updateProgressBar();
    }
  }, 100);
}
function advancePlayer(){
  const isNewRound = playerCtx.index < playerCtx.steps.length-1 &&
    playerCtx.steps[playerCtx.index].roundTitle !== playerCtx.steps[playerCtx.index+1]?.roundTitle;
  playerCtx.index++;
  if(playerCtx.index >= playerCtx.steps.length){
    clearTimer();
    chime();
    playerCtx.onFinish();
    return;
  }
  beep(isNewRound ? 740 : 520, isNewRound?0.14:0.08, isNewRound?0.06:0.045);
  playerCtx.secondsLeft = settings.seconds;
  renderPlayerFrame(false);
}
function togglePause(){
  if(!playerCtx) return;
  if(playerCtx.mode==='audio'){
    if(playerCtx.audioEl.paused){ playerCtx.audioEl.play(); } else { playerCtx.audioEl.pause(); }
  } else {
    playerCtx.paused = !playerCtx.paused;
  }
  const btn = document.getElementById('pauseBtn');
  const isPaused = playerCtx.mode==='audio' ? playerCtx.audioEl.paused : playerCtx.paused;
  if(btn) btn.textContent = isPaused ? '▶' : '❚❚';
}
function skipPoint(){
  if(!playerCtx) return;
  if(playerCtx.mode==='audio'){
    const next = playerCtx.index+1 < playerCtx.timestamps.length ? playerCtx.timestamps[playerCtx.index+1] : playerCtx.sliceEndTime;
    if(next==null){ playerCtx.audioEl.pause(); playerCtx.onFinish(); }
    else {
      playerCtx.audioEl.currentTime = next;
      const p = playerCtx.audioEl.play();
      if(p && p.catch) p.catch(()=>{});
    }
  } else {
    advancePlayer();
  }
}
function exitPlayer(){
  clearTimer();
  if(playerCtx && playerCtx.mode==='audio' && playerCtx.audioEl){
    playerCtx.audioEl.ontimeupdate = null;
    playerCtx.audioEl.onended = null;
    playerCtx.audioEl.pause();
  }
  playerCtx=null;
  goto('home');
}

function updateProgressBar(){
  const fill = document.getElementById('progFill');
  if(!fill || !playerCtx) return;
  const pct = 100 - (playerCtx.secondsLeft/settings.seconds)*100;
  fill.style.width = Math.max(0,Math.min(100,pct))+'%';
}

function renderPlayerFrame(isFirst){
  const cat = state.category;
  const step = playerCtx.steps[playerCtx.index];
  const wrap = el('div',{class:'player'});

  const top = el('div',{class:'player-top'});
  top.appendChild(el('button',{class:'exit',onclick:exitPlayer},'×'));
  const phaseLabel = step.phase==='intro' ? 'Introducción'
    : step.phase==='karate' ? 'Preparación'
    : step.phase==='transition' ? step.name
    : step.phase==='round' ? step.roundTitle
    : step.phase==='apertura' ? 'Ronda de apertura'
    : step.phase==='outro' ? 'Cierre de la sesión'
    : 'Cierre';
  top.appendChild(el('span',{class:'phase-label'}, phaseLabel));
  top.appendChild(el('span',{style:'width:22px'}));
  wrap.appendChild(top);

  wrap.appendChild(el('div',{class:'progress-track'}, el('div',{class:'progress-fill',id:'progFill'})));

  const mid = el('div',{class:'player-mid'});
  if(step.phase==='karate'){
    mid.appendChild(el('div',{class:'rep-count'}, `Repetición ${step.repIndex+1} de ${step.repTotal}`));
  }
  const diagramHolder = el('div',{html: buildDiagramHTML(step.key)});
  mid.appendChild(diagramHolder);
  mid.appendChild(el('div',{class:'point-name'}, step.name));
  mid.appendChild(el('div',{class:'point-where'}, step.where));
  mid.appendChild(el('div',{class:'point-phrase'}, `"${step.phrase}"`));
  if(step.phase==='intro' && cat.audio && cat.audio.introAsksRating){
    const scaleHolder = el('div',{});
    mid.appendChild(scaleHolder);
    renderThermometerHorizontal(scaleHolder, state.sudBefore, (v)=>{ state.sudBefore = v; });
  }
  wrap.appendChild(mid);

  const controls = el('div',{class:'player-controls'});
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:togglePause,id:'pauseBtn'}, '❚❚'));
  controls.appendChild(el('button',{class:'ctrl-btn',onclick:skipPoint}, '⏭'));
  wrap.appendChild(controls);

  if(step.phase==='intro'){
    wrap.appendChild(el('button',{class:'btn btn-ghost',style:'margin-top:14px;',onclick:skipPoint},'Saltar introducción →'));
  }

  app.replaceChildren(wrap);
}

  const wrap = el('div',{});
  const hero = el('div',{class:'hero-wrap'});
  if(cat.photo){
    hero.appendChild(el('img',{src:cat.photo, alt:cat.name}));
  } else {
    hero.appendChild(el('div',{class:'hero-fallback', style:`background:linear-gradient(135deg, ${cat.color}, ${cat.color}CC)`}));
  }
  hero.appendChild(el('button',{class:'hero-back', onclick:()=>goto('home')},'‹'));
  wrap.appendChild(hero);

  const body = el('div',{class:'detail-body'});
  body.appendChild(el('h1',{}, cat.name));
  body.appendChild(el('div',{class:'detail-meta'}, `${mins} min · sesión guiada`));

  const toast = el('div',{class:'action-toast'});
  const favActive = isFavorite(cat.id);
  const favItem = el('button',{class:'action-item'+(favActive?' active':''), onclick:(e)=>{
    toggleFavorite(cat.id);
    const nowActive = isFavorite(cat.id);
    e.currentTarget.classList.toggle('active', nowActive);
    toast.textContent = nowActive ? 'Añadida a favoritos' : 'Quitada de favoritos';
    setTimeout(()=>{ toast.textContent=''; }, 3000);
  }},[ el('span',{class:'icon'},'★'), el('span',{class:'label'},'Favorito') ]);
  const shareItem = el('button',{class:'action-item', onclick:async ()=>{
    const shareData = { title: cat.name, text: `Prueba la sesión de "${cat.name}" en Centro Tapping`, url: location.href };
    try{
      if(navigator.share){ await navigator.share(shareData); }
      else { await navigator.clipboard.writeText(location.href); toast.textContent='Enlace copiado'; setTimeout(()=>{ toast.textContent=''; }, 3000); }
    }catch(e){}
  }},[ el('span',{class:'icon'},'↗'), el('span',{class:'label'},'Compartir') ]);
  const actionRow = el('div',{class:'action-row'},[favItem, shareItem]);
  body.appendChild(actionRow);
  body.appendChild(toast);

  body.appendChild(el('p',{class:'detail-desc'}, cat.intro || cat.desc || ''));
  body.appendChild(el('button',{class:'btn btn-primary',onclick:()=>{ state.quickMode=false; goto('sud-before',{category:cat, sudBefore:5}); }},'Comenzar'));
  wrap.appendChild(body);

  app.replaceChildren(wrap);
}

function renderHome(){
  const header = el('div',{class:'home-header'},[
    el('div',{class:'eyebrow'},'Tu práctica diaria'),
    el('h1',{},'Tapping'),
    el('p',{},'Elige qué te está pidiendo atención ahora mismo. La app avanza sola por los puntos — tú solo golpetea.'),
  ]);

  const primera = el('div',{class:'intro-card',onclick:()=>{ state.quickMode=true; goto('sud-before',{category:PRIMERA_SESION, sudBefore:5}); }},[
    el('div',{class:'dot'},'★'),
    el('div',{},[el('h3',{},'Tu primera sesión'),el('span',{},'No necesitas saber tapping. Te guiamos paso a paso · 3 min')]),
  ]);

  const intro = el('div',{class:'intro-card',onclick:()=>goto('intro')},[
    el('div',{class:'dot'},'?'),
    el('div',{},[el('h3',{},'¿Cómo funciona?'),el('span',{},'En 1 minuto')]),
  ]);

  const quickList = [
    {label:'Necesito calmarme', id:'ansiedad'},
    {label:'Estoy preocupada', id:'preocupacion'},
    {label:'Necesito soltar bloqueos', id:'resistencias'},
    {label:'Necesito desconectar', id:'jornada'},
  ];
  const quickRow = el('div',{class:'quick-row'});
  quickList.forEach(q=>{
    const cat = CATEGORIES.find(c=>c.id===q.id);
    if(!cat) return;
    quickRow.appendChild(el('button',{class:'quick-pill', onclick:()=>{ state.quickMode=true; goto('sud-before',{category:cat, sudBefore:5}); }}, q.label));
  });
  const quickBlock = el('div',{class:'quick-block'},[
    el('div',{class:'quick-title'},'⚡ Necesito algo rápido'),
    quickRow,
  ]);

  const cards = CATEGORIES.map(cat=>{
    const mins = estimateMinutes(cat, settings.seconds);
    const overlay = el('div',{class:'cat-overlay'});
    const text = el('div',{class:'cat-text'},[ el('h3',{},cat.name), el('span',{},`${mins} min · ${cat.desc}`) ]);
    const card = el('div',{class:'cat-card', style:`background:${cat.photo?`url('${cat.photo}') center/cover`:`linear-gradient(135deg, ${cat.color}, ${cat.color}CC)`}`, onclick:()=>{ state.quickMode=false; goto('cat-detail',{category:cat}); }},[overlay, text]);
    return card;
  });

  const hist = loadHistory();
  const histLink = el('div',{class:'hist-link',onclick:()=>goto('history')},[
    el('span',{},`Historial · ${hist.length} sesión${hist.length===1?'':'es'}`),
    el('span',{},'›')
  ]);
  const favCount = loadFavorites().length;
  const favLink = el('div',{class:'hist-link',onclick:()=>goto('favorites')},[
    el('span',{},`★ Favoritos · ${favCount}`),
    el('span',{},'›')
  ]);

  const footer = el('div',{class:'footer-note'},[
    'Esta app es un apoyo personal de autoayuda, no sustituye la atención médica o psicológica profesional. No diagnostica ni trata ninguna condición médica o psicológica. ',
    el('a',{href:'legal.html', style:'color:var(--sienna-deep);'}, 'Privacidad y términos'),
  ]);
  app.replaceChildren(header, primera, intro, quickBlock, el('div',{class:'grid'}, cards), secRowBuilder(), favLink, histLink, footer);
}

function secRowBuilder(){
  const secRow = el('div',{class:'settings-row'});
  secRow.appendChild(el('span',{}, 'Segundos por punto'));
  const seg = el('div',{class:'seg'});
  [[6,'Rápida'],[9,'Normal'],[12,'Profunda']].forEach(([sec,label])=>{
    const b = el('button',{class: settings.seconds===sec?'active':'', onclick:()=>{ settings.seconds=sec; saveSettings(settings); renderHome(); }}, label);
    seg.appendChild(b);
  });
  secRow.appendChild(seg);
  return secRow;
}

function renderIntro(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('h2',{},'Cómo funciona'));
  const steps = [
    'Elige la categoría que necesites ahora mismo.',
    'Valora la intensidad del 0 al 10 con el termómetro.',
    'La app avanza sola por los 9 puntos, con un pitido en cada cambio — tú solo golpetea.',
    'Al terminar, vuelves a valorar cómo te sientes y se guarda en tu historial.',
  ];
  steps.forEach((s,i)=>{
    wrap.appendChild(el('p',{class:'stage-copy'}, `${i+1}. ${s}`));
  });
  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('home')},'Entendido'));
  app.replaceChildren(wrap);
}

function topBar(onBack){
  return el('div',{class:'topbar'},[ el('button',{class:'back-btn',onclick:onBack},'‹ Atrás'), el('span',{}) ]);
}

function renderSudBefore(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'Antes de empezar'));

  if(cat.audio && state.audioOn===undefined) state.audioOn = true;
  const skipRatingHere = !!(cat.audio && cat.audio.introAsksRating && state.audioOn);

  if(!skipRatingHere){
    wrap.appendChild(el('p',{class:'stage-copy'},'¿Cuánto te está afectando esto ahora mismo?'));
    const thermoContainer = el('div',{style:'margin-bottom:20px;'});
    wrap.appendChild(thermoContainer);
    renderThermometer(thermoContainer, state.sudBefore, (v)=>{ state.sudBefore = v; });
  } else {
    wrap.appendChild(el('p',{class:'stage-copy'},'Al empezar, la propia sesión te va a pedir que valores del 0 al 10 cuánto te está afectando esto.'));
  }

  if(cat.note) wrap.appendChild(el('p',{class:'stage-copy',style:'font-size:13.5px;'}, cat.note));

  if(cat.audio){
    const audioRow = el('div',{class:'settings-row'});
    audioRow.appendChild(el('span',{}, '🔊 Escuchar con audio'));
    const seg = el('div',{class:'seg'});
    const onBtn = el('button',{class: state.audioOn?'active':'', onclick:()=>{ state.audioOn=true; renderSudBefore(); }}, 'Sí');
    const offBtn = el('button',{class: !state.audioOn?'active':'', onclick:()=>{ state.audioOn=false; renderSudBefore(); }}, 'Solo texto');
    seg.appendChild(onBtn); seg.appendChild(offBtn);
    audioRow.appendChild(seg);
    wrap.appendChild(audioRow);
  }

  wrap.appendChild(el('div',{class:'phrase-box'}, el('p',{}, cat.karate)));
  wrap.appendChild(el('p',{class:'stage-copy',style:'margin-top:-10px;'},'Esta es la frase de preparación para el canto de la mano.'));

  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>{
    ensureAudio();
    goto('player-main');
  }},'Empezar sesión'));
  app.replaceChildren(wrap);
}

function renderPlayerMain(){
  const cat = state.category;
  if(state.quickMode){
    const seq = buildQuickSequence(cat);
    startPlayer(seq, ()=> goto('breath'));
    return;
  }
  if(cat.audio && state.audioOn){
    const totalSteps = buildAudioSteps(cat).length;
    startAudioSlice(cat, 0, totalSteps, ()=> goto('breath'));
  } else {
    const seq = buildSequence(cat);
    startPlayer(seq, ()=> goto('breath'));
  }
}

function renderBreath(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'Respira'));
  wrap.appendChild(el('p',{class:'stage-copy'},'Haz 3 respiraciones lentas. Piensa otra vez en lo mismo y valora cómo lo sientes ahora.'));
  wrap.appendChild(el('div',{class:'spacer'}));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('sud-after')},'Estoy lista'));
  app.replaceChildren(wrap);
}

function renderSudAfter(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('div',{class:'cat-tag'},cat.name));
  wrap.appendChild(el('h2',{},'¿Cómo te sientes ahora?'));

  const thermoContainer = el('div',{style:'margin-bottom:20px;'});
  wrap.appendChild(thermoContainer);
  renderThermometer(thermoContainer, state.sudAfter, (v)=>{ state.sudAfter = v; });

  wrap.appendChild(el('div',{class:'spacer'}));
  const finishLabel = state.quickMode ? 'Guardar y terminar' : 'Guardar sesión';
  const onFinish = state.quickMode ? 'home' : 'done';
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>{
    const hist = loadHistory();
    hist.unshift({date:new Date().toISOString(), category:cat.name, before:state.sudBefore, after:state.sudAfter});
    saveHistory(hist.slice(0,200));
    goto(onFinish);
  }}, finishLabel));
  app.replaceChildren(wrap);
}

function renderDone(){
  const cat = state.category;
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(el('div',{class:'spacer'}));
  const summary = el('div',{class:'end-summary'},[
    el('div',{class:'num'},[el('strong',{},String(state.sudBefore)), el('span',{},'antes')]),
    el('div',{class:'arrow'},'→'),
    el('div',{class:'num'},[el('strong',{},String(state.sudAfter)), el('span',{},'después')]),
  ]);
  wrap.appendChild(el('h2',{style:'text-align:center;margin-bottom:8px;'},'Tu sesión'));
  wrap.appendChild(summary);
  const diff = state.sudBefore - state.sudAfter;
  let diffText;
  if(diff>0) diffText = `Has bajado ${diff} punto${diff===1?'':'s'} en esta sesión.`;
  else if(diff<0) diffText = `La intensidad subió ${-diff} punto${diff===-1?'':'s'} — a veces pasa, no hay problema en repetir o dejarlo para otro momento.`;
  else diffText = 'La intensidad se mantuvo igual esta vez.';
  wrap.appendChild(el('p',{class:'stage-copy',style:'text-align:center;'}, diffText));
  wrap.appendChild(el('p',{class:'stage-copy',style:'text-align:center;font-size:15px;'},'¿Quieres hacer otra ronda?'));
  wrap.appendChild(el('button',{class:'btn btn-primary',onclick:()=>goto('sud-before',{category:cat, sudBefore:state.sudAfter})},'Hacer otra ronda'));
  wrap.appendChild(el('button',{class:'btn btn-ghost',onclick:()=>goto('home')},'Volver al inicio'));
  wrap.appendChild(el('div',{class:'spacer'}));
  app.replaceChildren(wrap);
}

function renderFavorites(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('h2',{style:'margin-bottom:16px;'},'Favoritos'));
  const favIds = loadFavorites();
  const favCats = CATEGORIES.filter(c=>favIds.includes(c.id));
  if(favCats.length===0){
    wrap.appendChild(el('div',{class:'empty-hist'},'Aún no has marcado ninguna sesión como favorita. Entra a una sesión y toca la estrella.'));
  } else {
    favCats.forEach(cat=>{
      wrap.appendChild(el('div',{class:'hist-item', style:'cursor:pointer;', onclick:()=>goto('cat-detail',{category:cat})},[
        el('div',{class:'l'},[el('strong',{},cat.name), el('span',{},cat.desc||'')]),
        el('div',{class:'r'},'›')
      ]));
    });
  }
  app.replaceChildren(wrap);
}

function renderHistory(){
  const wrap = el('div',{class:'session-wrap'});
  wrap.appendChild(topBar(()=>goto('home')));
  wrap.appendChild(el('h2',{style:'margin-bottom:16px;'},'Historial'));
  const hist = loadHistory();
  if(hist.length===0){
    wrap.appendChild(el('div',{class:'empty-hist'},'Aún no has guardado ninguna sesión.'));
  } else {
    hist.forEach(h=>{
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
      wrap.appendChild(el('div',{class:'hist-item'},[
        el('div',{class:'l'},[el('strong',{},h.category), el('span',{},dateStr)]),
        el('div',{class:'r'},`${h.before} → ${h.after}`)
      ]));
    });
  }
  app.replaceChildren(wrap);
}

function render(){
  switch(state.screen){
    case 'home': return renderHome();
    case 'cat-detail': return renderCatDetail();
    case 'intro': return renderIntro();
    case 'sud-before': return renderSudBefore();
    case 'player-main': return renderPlayerMain();
    case 'breath': return renderBreath();
    case 'sud-after': return renderSudAfter();
    case 'done': return renderDone();
    case 'favorites': return renderFavorites();
    case 'history': return renderHistory();
  }
}

render();
</script>
</body>
</html>
